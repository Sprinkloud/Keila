<style>
:root{
  --paper:#f4f3ef;
  --card:#ffffff;
  --ink:#17181c;
  --muted:#71727a;
  --line:#e3e1da;
  --line-soft:#efeee9;
  --accent:#cf2e64;
  --accent-soft:#fdeff4;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- Estructura ---------- */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.stage{display:flex;flex-direction:column;min-height:0;flex:1}
.work{display:flex;flex-direction:column;min-height:0;flex:1;order:1}

/* ---------- Cabecera ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);
}
.title{display:flex;align-items:baseline;gap:10px;min-width:0}
.title h1{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap}
.title .meter{font-family:Newsreader,Georgia,serif;font-size:15px;color:var(--muted)}
.back{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap;
}
.back:active{background:var(--line-soft)}

/* ---------- Transporte ---------- */
.transport{background:var(--card);border-bottom:1px solid var(--line)}
.tline{display:flex;align-items:center;gap:14px;padding:10px 16px}
.tline+.tline{border-top:1px solid var(--line-soft)}

.beats{display:flex;gap:7px;align-items:center}
.beat{
  width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:Newsreader,Georgia,serif;font-size:14px;color:var(--muted);
  transition:background-color .06s linear,color .06s linear,border-color .06s linear;
}
.beat.lit{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.beat.lit.strong{background:var(--accent);border-color:var(--accent)}

.now{
  flex:1;min-width:0;font-family:Newsreader,Georgia,serif;font-size:24px;line-height:1.1;
  color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.now.idle{color:var(--muted);font-size:14px;font-family:Inter,sans-serif}

.play{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:44px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--paper);
  font-size:14px;font-weight:500;min-width:132px;
}
.play:active{transform:scale(.98)}
.play.on{background:var(--accent)}
.icon-btn{
  width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:var(--line-soft)}

.opts{overflow-x:auto;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opts{-ms-overflow-style:none}

.tempo{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.tempo label{font-size:12px;color:var(--muted)}
.tempo output{font-family:Newsreader,Georgia,serif;font-size:19px;min-width:34px;text-align:right}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:112px;height:24px;background:none;
}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;margin-top:-10px;border-radius:50%;
  background:var(--ink);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid var(--card);
}

.chip{
  display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  font-size:13px;color:var(--muted);white-space:nowrap;
}
.chip:active{background:var(--line-soft)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.chip[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed=true] .dot{background:var(--accent)}

/* ---------- Partitura ---------- */
.score{flex:1;min-height:0;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.score-inner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.bar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 10px 10px;transition:border-color .12s,background-color .12s;
}
.bar.playing{border-color:var(--accent);background:var(--accent-soft)}
.bar-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--muted);padding:4px 4px 6px;
}
.bar-head .n{font-family:Newsreader,Georgia,serif;font-size:14px;color:var(--ink)}
.bar-row{display:flex;align-items:stretch;gap:6px}

.slot{
  position:relative;border-radius:10px;padding:2px 0;
  display:flex;align-items:center;justify-content:center;min-width:0;
  border:1px solid transparent;
}
.slot:hover{border-color:var(--line);background:var(--line-soft)}
.slot .rsvg{height:78px;width:auto;max-width:100%;color:var(--ink)}
.slot .kill{
  position:absolute;top:0;right:0;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  opacity:0;transition:opacity .12s;
}
.slot:hover .kill,.slot:focus-within .kill{opacity:1}
.slot .kill:hover{color:var(--accent);background:var(--accent-soft)}
.gap{
  flex:1;min-width:40px;border:1px dashed var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--muted);text-align:center;padding:4px;
}

.nt{color:var(--ink);transition:color .05s linear}
.nt.on{color:var(--accent)}
.syl{font-family:Newsreader,Georgia,serif}

.empty{
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:26px 20px;text-align:center;
}
.empty p{margin:0 0 4px;font-size:15px}
.empty small{color:var(--muted);font-size:13px}
.examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.example{
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;background:var(--paper);
}
.example:active{background:var(--line-soft)}

/* ---------- Barra de estado ---------- */
.status{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 16px;border-top:1px solid var(--line);background:var(--card);
  font-size:12px;color:var(--muted);
}
.status .keys{display:none}
.status strong{font-weight:500;color:var(--ink)}
.status.alert strong{color:var(--accent)}

/* ---------- Paleta ---------- */
.panel{
  order:2;background:var(--card);border-top:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;max-height:47vh;
  padding-bottom:env(safe-area-inset-bottom);
}
.panel-top{display:flex;align-items:center;gap:8px;padding:8px 12px 0}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tab{
  flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tab[aria-selected=true]{background:var(--ink);color:var(--paper)}
.hint{margin:8px 12px 0;font-size:12px;color:var(--muted);line-height:1.4}

.palette{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;
  padding:10px 12px 12px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;
}
.cell{
  position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  min-height:96px;justify-content:center;
}
.cell:active{background:var(--accent-soft);border-color:var(--accent)}
.cell .rsvg{height:62px;width:auto;max-width:100%}
.cell .len{font-size:11px;color:var(--muted)}
.cell .cname{font-size:12px;color:var(--ink)}
.cell .hear{
  position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.cell .hear:hover{color:var(--accent);background:var(--accent-soft)}
.cell .num{position:absolute;top:5px;left:7px;font-size:10px;color:var(--line);font-variant-numeric:tabular-nums}

.panel-foot{
  display:flex;gap:8px;padding:0 12px 12px;overflow-x:auto;scrollbar-width:none;
}
.panel-foot::-webkit-scrollbar{display:none}
.tool{
  flex:0 0 auto;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;
  font-size:13px;background:var(--card);display:inline-flex;align-items:center;gap:7px;
}
.tool:active{background:var(--line-soft)}
.tool.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- Dictado ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(23,24,28,.42);display:none;
  align-items:flex-end;justify-content:center;z-index:40;
}
.overlay.open{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
}
.sheet h2{margin:0 0 2px;font-size:17px;font-weight:600}
.sheet .sub{margin:0 0 16px;font-size:13px;color:var(--muted)}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.quiz-opt{
  border:1px solid var(--line);border-radius:12px;padding:8px 4px;background:var(--card);
  display:flex;align-items:center;justify-content:center;min-height:88px;
}
.quiz-opt .rsvg{height:64px;width:auto;max-width:100%}
.quiz-opt.right{border-color:var(--accent);background:var(--accent-soft)}
.quiz-opt.wrong{opacity:.4}
.quiz-actions{display:flex;gap:8px;align-items:center}
.verdict{font-size:14px;min-height:22px;margin:0 0 10px}
.verdict b{font-weight:500;color:var(--accent)}
.score-line{font-size:13px;color:var(--muted)}

/* ---------- Escritorio ---------- */
@media (min-width:860px){
  .stage{flex-direction:row}
  .panel{
    order:0;max-height:none;width:308px;flex:0 0 308px;
    border-top:0;border-right:1px solid var(--line);
  }
  .palette{grid-template-columns:1fr 1fr}
  .work{order:1;flex:1}
  .score{padding:24px}
  .status .keys{display:block}
  .now{font-size:28px}
  .tline{padding:12px 20px}
  .top{padding:12px 20px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="title">
      <h1>Células rítmicas</h1>
      <span class="meter">4/4</span>
    </div>
    <a class="back" href="https://sprinkloud.vercel.app/material.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

<script>
"use strict";

/* =========================================================
   1. Células rítmicas
   Cada nota es {b: figura base en pulsos, dot: con puntillo,
   t: de tresillo, rest: silencio}
   ========================================================= */
const CELLS = [
  {id:"pan",   tab:"base", name:"pan",       syl:["pan"],                    notes:[{b:1}]},
  {id:"luna",  tab:"base", name:"luna",      syl:["lu","na"],                notes:[{b:.5},{b:.5}]},
  {id:"choco", tab:"base", name:"chocolate", syl:["cho","co","la","te"],     notes:[{b:.25},{b:.25},{b:.25},{b:.25}]},
  {id:"gran",  tab:"base", name:"gránchico", syl:["graan","chi","co"],        notes:[{b:.5},{b:.25},{b:.25}]},
  {id:"cama",  tab:"base", name:"camarón",   syl:["ca","ma","roon"],          notes:[{b:.25},{b:.25},{b:.5}]},
  {id:"vali",  tab:"base", name:"valiente",  syl:["va","lieen","te"],         notes:[{b:.25},{b:.5},{b:.25}]},
  {id:"blan",  tab:"base", name:"blanco",    syl:["blaaan","co"],              notes:[{b:.5,dot:1},{b:.25}]},
  {id:"ques",  tab:"base", name:"queso",     syl:["me","looon"],               notes:[{b:.25},{b:.5,dot:1}]},
  {id:"musi",  tab:"base", name:"música",    syl:["mú","si","ca"],           notes:[{b:.5,t:1},{b:.5,t:1},{b:.5,t:1}]},
  {id:"y",     tab:"base", name:"y",         syl:["y"],                      notes:[{b:.5}]},

  {id:"lee",   tab:"extended", name:"Lee",       full:"negra con puntillo",  syl:["pan-y"],      notes:[{b:1,dot:1}]},
  {id:"bla2",  tab:"extended", name:"1, 2",     full:"blanca",              syl:["1 - 2"],     notes:[{b:2}]},
  {id:"bla3",  tab:"extended", name:"1, 2, 3",  full:"blanca con puntillo", syl:["1 - 2 - 3"], notes:[{b:2,dot:1}]},
  {id:"red",   tab:"extended", name:"1, 2, 3, 4", full:"redonda",          syl:["1 - 2 - 3 - 4"], notes:[{b:4}]},

  {id:"s16",   tab:"silences", name:"silencio de semicorchea", syl:[""], notes:[{b:.25,rest:1}]},
  {id:"s8",    tab:"silences", name:"silencio de corchea",     syl:[""], notes:[{b:.5,rest:1}]},
  {id:"s4",    tab:"silences", name:"silencio de negra",       syl:[""], notes:[{b:1,rest:1}]},
  {id:"s2",    tab:"silences", name:"silencio de blanca",      syl:[""], notes:[{b:2,rest:1}]},
  {id:"ct",    tab:"silences", name:"contratiempo",  syl:["","pan"], notes:[{b:.5,rest:1},{b:.5}]},
  {id:"pc",    tab:"silences", name:"pan cortado",   syl:["pan",""], notes:[{b:.5},{b:.5,rest:1}]}
];

const HINTS = {
  base:      "Cada célula dura un pulso. Empieza por pan y luna, y añade una nueva cuando ya la cantes sin dudar.",
  extended:  "Figuras que ocupan más de un pulso: sostén la voz mientras cuentas.",
  silences:  "Los silencios también se cuentan. Piensa la sílaba por dentro sin cantarla."
};

const EXAMPLES = [
  {name:"Marcha",          ids:["pan","luna","pan","pan","luna","luna","pan","pan"]},
  {name:"Corcheas y semis",ids:["luna","choco","luna","pan","choco","luna","choco","pan"]},
  {name:"Con silencios",   ids:["pan","s4","luna","pan","luna","s4","choco","pan"]},
  {name:"Puntillos",       ids:["blan","luna","ques","pan","blan","blan","luna","pan"]}
];

const byId = id => CELLS.find(c => c.id === id);

/* =========================================================
   2. Notación dibujada en SVG (sin depender de fuentes musicales)
   ========================================================= */
const G = {Y:50, TOP:16, RX:5.4, RY:4.1, SW:1.7, BEAM:4.6, GAP:6.6};
const rd = (x,n) => { const p = Math.pow(10, n||6); return Math.round(x*p)/p; };
const noteDur = n => rd(n.b * (n.dot ? 1.5 : 1) * (n.t ? 2/3 : 1));
const cellDur = c => rd(c.notes.reduce((s,n) => s + noteDur(n), 0), 3);
const flagsOf = n => (n.rest ? 0 : n.b === .25 ? 2 : n.b === .5 ? 1 : 0);

function flagGlyph(sx, top, count){
  let s = "";
  for(let k=0;k<count;k++){
    const y = top + k*7.6;
    s += '<path d="M'+(sx+G.SW)+','+y+' c8,3.4 10.5,9 6.6,15.2 c1.6,-7.2 -1.6,-10.2 -6.6,-11.8 z"/>';
  }
  return s;
}

function restGlyph(b, x){
  const Y = G.Y;
  if(b >= 4)
    return '<rect x="'+(x-13)+'" y="'+(Y-9)+'" width="26" height="1.4" opacity=".5"/><rect x="'+(x-9)+'" y="'+(Y-9)+'" width="18" height="6.2" rx="1"/>';
  if(b >= 2)
    return '<rect x="'+(x-13)+'" y="'+(Y+1)+'" width="26" height="1.4" opacity=".5"/><rect x="'+(x-9)+'" y="'+(Y-5)+'" width="18" height="6.2" rx="1"/>';
  if(b >= 1)
    return '<path d="M'+(x-4)+','+(Y-18)+' L'+(x+4)+','+(Y-9)+' L'+(x-3)+','+(Y-1)+' L'+(x+4.5)+','+(Y+7)+'" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>'
         + '<path d="M'+(x+4.5)+','+(Y+7)+' c-5.6,-3.6 -10.2,-0.4 -8.1,4.3 c1.2,2.9 3.9,4.7 6.7,5.7 c-3.7,-4.1 -2.4,-7.7 2.4,-6.5 z"/>';
  if(b >= .5)
    return '<path d="M'+(x+4)+','+(Y-11)+' L'+(x-3.6)+','+(Y+11)+'" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'
         + '<circle cx="'+(x-.2)+'" cy="'+(Y-8.4)+'" r="3.4"/>';
  return '<path d="M'+(x+4)+','+(Y-16)+' L'+(x-4.2)+','+(Y+12)+'" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'
       + '<circle cx="'+(x+.2)+'" cy="'+(Y-13.4)+'" r="3.2"/><circle cx="'+(x-2.4)+'" cy="'+(Y-2.6)+'" r="3.2"/>';
}

function cellSVG(cell, opt){
  opt = opt || {};
  const showSyl = opt.showSyl !== false;
  const prefix = opt.prefix;
  const ns = cell.notes, dur = cellDur(cell);

  let acc = 0;
  const ts = ns.map(n => { const v = acc; acc += noteDur(n); return v; });

  // El ancho respeta la proporción de las duraciones, pero nunca deja
  // que dos sílabas se toquen.
  const sw = i => (showSyl && cell.syl && cell.syl[i] ? 6.4*cell.syl[i].length : 12);
  let span = 54*Math.pow(dur,.55) - 36;
  for(let i=0;i<ns.length-1;i++){
    const need = (sw(i)+sw(i+1))/2 + 7;
    span = Math.max(span, need / (noteDur(ns[i])/dur));
  }
  const W = Math.round(Math.min(320, Math.max(70, span + 36)));
  const L = 18, R = W - 18;
  const xs = ns.map((n,i) => ns.length === 1 ? W/2 : L + (ts[i]/dur)*(R-L));
  const dx = G.RX - .6;

  // Grupos unidos por barra
  const groups = []; let cur = null;
  ns.forEach((n,i) => {
    if(flagsOf(n) > 0){ if(!cur){ cur = []; groups.push(cur); } cur.push(i); }
    else cur = null;
  });

  const beamed = new Set();
  const beams = [];
  groups.forEach(gr => {
    if(gr.length < 2) return;
    gr.forEach(i => beamed.add(i));
    const maxF = Math.max.apply(null, gr.map(i => flagsOf(ns[i])));
    for(let lv=1; lv<=maxF; lv++){
      let p = 0;
      while(p < gr.length){
        if(flagsOf(ns[gr[p]]) < lv){ p++; continue; }
        let q = p;
        while(q+1 < gr.length && flagsOf(ns[gr[q+1]]) >= lv) q++;
        const y = G.TOP + (lv-1)*G.GAP;
        if(q > p){
          const x1 = xs[gr[p]]+dx-.5, x2 = xs[gr[q]]+dx+G.SW+.5;
          beams.push('<rect x="'+x1.toFixed(1)+'" y="'+y+'" width="'+(x2-x1).toFixed(1)+'" height="'+G.BEAM+'" rx="0.7"/>');
        } else {
          const w = 8.5, x0 = xs[gr[p]]+dx;
          const x1 = p === 0 ? x0 : x0 - w + G.SW;   // barra corta hacia el lado del grupo
          beams.push('<rect x="'+x1.toFixed(1)+'" y="'+y+'" width="'+w+'" height="'+G.BEAM+'" rx="0.7"/>');
        }
        p = q + 1;
      }
    }
    if(ns[gr[0]].t){
      const cx = (xs[gr[0]] + xs[gr[gr.length-1]] + dx)/2;
      beams.push('<text x="'+cx.toFixed(1)+'" y="'+(G.TOP-4)+'" text-anchor="middle" font-size="11.5" font-style="italic" font-weight="600">3</text>');
    }
  });

  const parts = ns.map((n,i) => {
    const x = xs[i];
    const nid = prefix != null ? ' data-nid="'+prefix+'-'+i+'"' : "";
    let s = "";
    if(n.rest){
      s += restGlyph(n.b, x);
    } else {
      const hollow = n.b >= 2;
      s += '<ellipse cx="'+x.toFixed(1)+'" cy="'+G.Y+'" rx="'+(hollow?6.3:G.RX)+'" ry="'+(hollow?4.6:G.RY)+'" transform="rotate(-16 '+x.toFixed(1)+' '+G.Y+')" '+(hollow?'fill="none" stroke="currentColor" stroke-width="1.8"':"")+'/>';
      if(n.b < 4){
        const sx = x + dx, top = flagsOf(n) > 0 ? G.TOP : G.TOP+3;
        s += '<rect x="'+sx.toFixed(1)+'" y="'+top+'" width="'+G.SW+'" height="'+(G.Y-top).toFixed(1)+'"/>';
        if(!beamed.has(i) && flagsOf(n) > 0) s += flagGlyph(sx, G.TOP, flagsOf(n));
      }
      if(n.dot) s += '<circle cx="'+(x+10.5).toFixed(1)+'" cy="'+G.Y+'" r="1.9"/>';
    }
    if(showSyl && cell.syl && cell.syl[i])
      s += '<text class="syl" x="'+x.toFixed(1)+'" y="73" text-anchor="middle" font-size="12">'+cell.syl[i]+'</text>';
    return '<g class="nt"'+nid+'>'+s+'</g>';
  }).join("");

  return '<svg class="rsvg" viewBox="0 0 '+W+' 82" width="'+W+'" height="82" fill="currentColor" aria-hidden="true">'+beams.join("")+parts+'</svg>';
}

function beatsLabel(d){
  const map = {0.25:"¼ de pulso", 0.5:"medio pulso", 0.75:"¾ de pulso",
               1:"1 pulso", 1.5:"1½ pulsos", 2:"2 pulsos", 2.5:"2½ pulsos",
               3:"3 pulsos", 3.5:"3½ pulsos", 4:"4 pulsos"};
  return map[d] || d + " pulsos";
}

/* =========================================================
   3. Estado
   ========================================================= */
const state = {
  tab:"base",
  comp:[],            // ids de células
  tempo:60,
  metro:false,
  count:true,
  loop:false
};
let history = [];
const KEY = "sprinkloud-ritmo-v1";

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({comp:state.comp, tempo:state.tempo, metro:state.metro, count:state.count, loop:state.loop})); }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if(!d) return;
    if(Array.isArray(d.comp)) state.comp = d.comp.filter(byId);
    if(d.tempo) state.tempo = d.tempo;
    state.metro = !!d.metro; state.count = d.count !== false; state.loop = !!d.loop;
  }catch(e){}
}

const $ = s => document.querySelector(s);
const totalBeats = () => rd(state.comp.reduce((s,id) => s + cellDur(byId(id)), 0), 3);
const freeInBar = () => { const r = rd(totalBeats() % 4, 3); return r === 0 ? 4 : rd(4-r, 3); };

/* =========================================================
   4. Audio
   ========================================================= */
let ctx = null, session = null;

function audio(){
  if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(ctx.state === "suspended") ctx.resume();
  return ctx;
}
function tone(dest, t, freq, dur, gain, type, sustain){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "triangle";
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + .004);
  if(sustain){
    // Ataque, caída a un nivel estable y corte al final: así la nota
    // dura de verdad lo que vale.
    g.gain.exponentialRampToValueAtTime(gain*.32, t + .14);
    g.gain.setValueAtTime(gain*.32, t + Math.max(dur - .09, .16));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  } else {
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + .02);
}
/* beats = duración de la nota en pulsos; beatSec = cuánto dura un pulso */
function noteVoice(dest, t, onBeat, beats, beatSec){
  const long = beats >= .95;
  const dur = long
    ? beats*beatSec*.94                                   // se sostiene
    : Math.min(Math.max(beats*beatSec*.85, .06), .24);    // percutida
  tone(dest, t, onBeat ? 740 : 560, dur, onBeat ? .34 : .24, "triangle", long);
}
function clickVoice(dest, t, strong){
  tone(dest, t, strong ? 1560 : 1040, .03, strong ? .3 : .18, "square");
}

/* Escucha suelta de una célula, sin tocar la reproducción */
function previewCell(cell){
  audio();
  const t0 = ctx.currentTime + .05, beat = 60/state.tempo;
  let t = 0;
  cell.notes.forEach(n => {
    const d = noteDur(n);
    if(!n.rest) noteVoice(ctx.destination, t0 + t*beat, Math.abs(t % 1) < .01, d, beat);
    t += d;
  });
}

/* =========================================================
   5. Reproducción
   ========================================================= */
const play = {on:false, start:0, beat:-1, idx:0, queued:false, ev:[], bars:0, raf:0, len:0};

function buildEvents(){
  const ev = []; let t = 0;
  state.comp.forEach((id, ci) => {
    byId(id).notes.forEach((n, ni) => {
      const d = noteDur(n);
      if(!n.rest) ev.push({t:t, d:d, ci:ci, ni:ni, syl:(byId(id).syl||[])[ni] || ""});
      t += d;
    });
  });
  return ev;
}

function schedulePass(at){
  const beat = 60/state.tempo;
  play.ev.forEach(e => noteVoice(session, at + e.t*beat, Math.abs(e.t % 1) < .01, e.d, beat));
  if(state.metro)
    for(let b=0; b<play.len; b++) clickVoice(session, at + b*beat, b % 4 === 0);
}

function startPlay(skipCount){
  if(!state.comp.length){ flash("Añade al menos una célula para escuchar", true); return; }
  audio();
  stopPlay(true);

  const beat = 60/state.tempo;
  play.ev = buildEvents();
  play.len = Math.max(4, Math.ceil(totalBeats()/4)*4);   // termina siempre el compás
  play.bars = play.len/4;

  session = ctx.createGain();
  session.gain.value = 1;
  session.connect(ctx.destination);

  const t0 = ctx.currentTime + .12;
  if(state.count && !skipCount){
    for(let b=0;b<4;b++) clickVoice(session, t0 + b*beat, b === 0);
    play.start = t0 + 4*beat;
  } else {
    play.start = t0;
  }
  schedulePass(play.start);

  play.on = true; play.beat = -1; play.idx = 0; play.queued = false;
  paintPlay();
  play.raf = requestAnimationFrame(tick);
}

function tick(){
  if(!play.on) return;
  const beat = 60/state.tempo;
  const rel = (ctx.currentTime - play.start)/beat;

  if(rel < 0){
    const n = Math.ceil(-rel);                     // cuenta previa: 4 3 2 1
    lampCount(5 - n);
    setNow((n) + "…", true);
  } else {
    const b = Math.floor(rel);
    if(b !== play.beat){
      play.beat = b;
      lampBeat(b % 4);
      markBar(Math.floor(b/4));
    }
    while(play.idx < play.ev.length && play.ev[play.idx].t <= rel + .012){
      activate(play.ev[play.idx]); play.idx++;
    }
  }

  const end = play.start + play.len*beat;
  if(state.loop && !play.queued && ctx.currentTime > end - .3){
    schedulePass(end); play.queued = true;
  }
  if(ctx.currentTime >= end){
    if(state.loop){
      play.start = end; play.idx = 0; play.queued = false; play.beat = -1;
    } else { stopPlay(); return; }
  }
  play.raf = requestAnimationFrame(tick);
}

function stopPlay(quiet){
  play.on = false;
  cancelAnimationFrame(play.raf);
  if(session){
    const g = session, t = ctx.currentTime;
    try{
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + .04);
    }catch(e){}
    setTimeout(() => { try{ g.disconnect(); }catch(e){} }, 300);
    session = null;
  }
  document.querySelectorAll(".nt.on").forEach(el => el.classList.remove("on"));
  document.querySelectorAll(".bar.playing").forEach(el => el.classList.remove("playing"));
  lampBeat(-1);
  if(!quiet){ paintPlay(); setNow(null); }
}

function togglePlay(){ play.on ? stopPlay() : startPlay(); }

/* --- Realimentación visual --- */
function lampBeat(i){
  document.querySelectorAll(".beat").forEach((el,k) => {
    el.classList.toggle("lit", k === i);
    el.classList.toggle("strong", k === i && i === 0);
  });
}
function lampCount(n){
  document.querySelectorAll(".beat").forEach((el,k) => {
    el.classList.toggle("lit", k < n);
    el.classList.toggle("strong", k < n);
  });
}
function setNow(text, small){
  const el = $("#now");
  if(text === null || text === undefined){
    el.textContent = "Pulsa reproducir y canta las sílabas";
    el.classList.add("idle");
  } else {
    el.textContent = text;
    el.classList.toggle("idle", !!small);
  }
}
let lastBar = -1;
function markBar(i){
  const bars = document.querySelectorAll(".bar");
  bars.forEach(b => b.classList.toggle("playing", +b.dataset.bar === i));
  if(i !== lastBar){
    lastBar = i;
    const el = bars[i];
    if(el) el.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
}
function activate(e){
  document.querySelectorAll(".nt.on").forEach(el => el.classList.remove("on"));
  const el = document.querySelector('[data-nid="'+e.ci+'-'+e.ni+'"]');
  if(el) el.classList.add("on");
  const c = byId(state.comp[e.ci]);
  setNow(e.syl || c.name, false);
}

/* =========================================================
   6. Paleta
   ========================================================= */
function renderPalette(){
  const box = $("#palette");
  box.innerHTML = "";
  $("#hint").textContent = HINTS[state.tab];
  CELLS.filter(c => c.tab === state.tab).forEach((c,i) => {
    const dur = cellDur(c);
    const joined = (c.syl||[]).join("").toLowerCase();
    const label = c.full || (joined !== c.name.replace(/[\s,]/g,"").toLowerCase() ? c.name : "");
    const b = document.createElement("button");
    b.className = "cell";
    b.setAttribute("aria-label","Añadir " + (c.full || c.name) + ", " + beatsLabel(dur));
    b.innerHTML =
      (i < 9 ? '<span class="num">'+(i+1)+'</span>' : "") +
      '<span class="hear" tabindex="-1" aria-hidden="true">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>' +
      '</span>' +
      cellSVG(c) +
      (label ? '<span class="cname">'+label+'</span>' : "") +
      '<span class="len">'+beatsLabel(dur)+'</span>';
    b.addEventListener("click", ev => {
      if(ev.target.closest(".hear")){ previewCell(c); return; }
      addCell(c.id);
    });
    box.appendChild(b);
  });
}

function switchTab(t){
  state.tab = t;
  document.querySelectorAll(".tab").forEach(el => el.setAttribute("aria-selected", el.dataset.tab === t));
  renderPalette();
}

/* =========================================================
   7. Partitura
   ========================================================= */
function renderScore(){
  const box = $("#score-inner");
  box.innerHTML = "";
  lastBar = -1;

  if(!state.comp.length){
    const d = document.createElement("div");
    d.className = "empty";
    d.innerHTML = '<p>Aquí se arma tu ritmo.</p>' +
      '<small>Toca una célula del banco y se irá colocando en compases de cuatro tiempos.</small>' +
      '<div class="examples"></div>';
    const ex = d.querySelector(".examples");
    EXAMPLES.forEach(p => {
      const b = document.createElement("button");
      b.className = "example"; b.textContent = p.name;
      b.onclick = () => { pushHistory(); state.comp = p.ids.slice(); afterEdit("Ejemplo cargado: " + p.name); };
      ex.appendChild(b);
    });
    box.appendChild(d);
    updateStatus();
    return;
  }

  // Repartir las células en compases de 4 pulsos
  const bars = []; let cur = [], acc = 0;
  state.comp.forEach((id,i) => {
    cur.push(i); acc = rd(acc + cellDur(byId(id)), 3);
    if(acc >= 3.999){ bars.push({items:cur, beats:acc}); cur = []; acc = 0; }
  });
  if(cur.length) bars.push({items:cur, beats:acc});

  bars.forEach((bar, bi) => {
    const el = document.createElement("section");
    el.className = "bar";
    el.dataset.bar = bi;
    const free = rd(4 - bar.beats, 3);
    el.innerHTML =
      '<div class="bar-head"><span class="n">Compás ' + (bi+1) + '</span>' +
      '<span>' + (free > 0 ? "faltan " + beatsLabel(free) : "completo") + '</span></div>' +
      '<div class="bar-row"></div>';
    const row = el.querySelector(".bar-row");

    bar.items.forEach(idx => {
      const c = byId(state.comp[idx]);
      const d = document.createElement("div");
      d.className = "slot";
      d.style.flex = cellDur(c) + " 1 auto";
      d.innerHTML = cellSVG(c, {prefix:idx}) +
        '<button class="kill" aria-label="Quitar ' + c.name + '">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
      d.querySelector(".kill").onclick = e => { e.stopPropagation(); removeAt(idx); };
      d.onclick = () => previewCell(c);
      row.appendChild(d);
    });

    if(free > 0){
      const g = document.createElement("div");
      g.className = "gap";
      g.style.flex = free + " 1 auto";
      g.textContent = beatsLabel(free);
      row.appendChild(g);
    }
    box.appendChild(el);
  });

  updateStatus();
}

function updateStatus(){
  const t = totalBeats();
  const bars = Math.ceil(t/4);
  $("#status-msg").textContent = t === 0
    ? "Listo"
    : bars + (bars === 1 ? " compás" : " compases") + " · " + beatsLabel(t) + " en total";
  $("#status").classList.remove("alert");
}

let flashTimer;
function flash(msg, alert){
  const s = $("#status");
  $("#status-msg").innerHTML = "<strong>" + msg + "</strong>";
  s.classList.toggle("alert", !!alert);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(updateStatus, 2200);
}

/* =========================================================
   8. Edición
   ========================================================= */
function pushHistory(){
  history.push(state.comp.slice());
  if(history.length > 60) history.shift();
}
function afterEdit(msg){
  renderScore(); save();
  if(msg) flash(msg);
}

function addCell(id){
  const c = byId(id), d = cellDur(c);
  const free = freeInBar();
  if(d > free + .001){
    flash("No cabe: en este compás solo quedan " + beatsLabel(free), true);
    return;
  }
  if(play.on) stopPlay();
  pushHistory();
  state.comp.push(id);
  previewCell(c);
  afterEdit();
}
function removeAt(i){
  if(play.on) stopPlay();
  pushHistory();
  state.comp.splice(i,1);
  afterEdit();
}
function undo(){
  if(!history.length){ flash("No hay nada que deshacer"); return; }
  if(play.on) stopPlay();
  state.comp = history.pop();
  afterEdit();
}
function clearAll(){
  if(!state.comp.length) return;
  if(play.on) stopPlay();
  pushHistory();
  state.comp = [];
  afterEdit("Partitura vacía");
}
function fillWithRests(){
  if(play.on) stopPlay();
  pushHistory();
  let free = freeInBar();
  const rests = [["s2",2],["s4",1],["s8",.5],["s16",.25]];
  while(free > .001){
    const r = rests.find(x => x[1] <= free + .001);
    if(!r) break;
    state.comp.push(r[0]); free = rd(free - r[1], 3);
  }
  afterEdit("Compás completado con silencios");
}

/* =========================================================
   9. Dictado rítmico
   ========================================================= */
const quiz = {target:null, opts:[], hits:0, tries:0, done:false};

function openQuiz(){ $("#quiz").classList.add("open"); nextQuiz(); }
function closeQuiz(){ $("#quiz").classList.remove("open"); }

function nextQuiz(){
  const pool = CELLS.filter(c => c.tab === state.tab && c.notes.some(n => !n.rest));
  const src = pool.length >= 4 ? pool : CELLS.filter(c => c.tab === "base");
  const shuffled = src.slice().sort(() => Math.random() - .5).slice(0,4);
  quiz.opts = shuffled;
  quiz.target = shuffled[Math.floor(Math.random()*shuffled.length)];
  quiz.done = false;
  $("#quiz-verdict").textContent = "";
  $("#quiz .sub").textContent = state.tab === "extended"
    ? "Cuenta los pulsos que dura la figura y elige cuál sonó."
    : "Escucha y elige la célula que sonó.";
  const box = $("#quiz-opts");
  box.innerHTML = "";
  quiz.opts.forEach(c => {
    const b = document.createElement("button");
    b.className = "quiz-opt";
    b.innerHTML = cellSVG(c, {showSyl:false});
    b.onclick = () => answerQuiz(c, b);
    box.appendChild(b);
  });
  updateQuizScore();
  setTimeout(hearQuiz, 350);
}

function hearQuiz(){
  audio();
  const beat = 60/state.tempo, t0 = ctx.currentTime + .12;
  const largo = Math.max(1, Math.ceil(cellDur(quiz.target)));

  // Dos pulsos de preparación y el pulso sigue marcándose bajo la célula:
  // sin esa referencia no hay forma de contar si duró 2, 3 o 4 tiempos.
  for(let b = 0; b <= 2 + largo; b++)
    clickVoice(ctx.destination, t0 + b*beat, b === 0 || b === 2);

  let t = 2;
  quiz.target.notes.forEach(n => {
    const d = noteDur(n);
    if(!n.rest) noteVoice(ctx.destination, t0 + t*beat, Math.abs(t % 1) < .01, d, beat);
    t += d;
  });
}

function answerQuiz(c, btn){
  if(quiz.done) return;
  quiz.done = true; quiz.tries++;
  const ok = c.id === quiz.target.id;
  if(ok) quiz.hits++;
  document.querySelectorAll(".quiz-opt").forEach((el,i) => {
    if(quiz.opts[i].id === quiz.target.id) el.classList.add("right");
    else el.classList.add("wrong");
  });
  const qn = quiz.target.full
    ? quiz.target.full + " (" + quiz.target.name + ")"
    : quiz.target.name;
  $("#quiz-verdict").innerHTML = ok
    ? 'Correcto: <b>' + qn + '</b>'
    : 'Sonó <b>' + qn + '</b>. Escúchala otra vez y compara.';
  updateQuizScore();
}
function updateQuizScore(){
  $("#quiz-score").textContent = quiz.tries ? quiz.hits + " de " + quiz.tries : "";
}

/* =========================================================
   10. Controles e inicio
   ========================================================= */
function paintPlay(){
  const b = $("#btn-play");
  b.classList.toggle("on", play.on);
  $("#play-text").textContent = play.on ? "Detener" : "Reproducir";
  $("#play-icon").innerHTML = play.on
    ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M7 4l13 8-13 8z"/>';
}
function toggleChip(el, key){
  state[key] = !state[key];
  el.setAttribute("aria-pressed", state[key]);
  save();
}

let taps = [];
function tapTempo(){
  const now = performance.now();
  taps = taps.filter(t => now - t < 2400);
  taps.push(now);
  if(taps.length >= 2){
    let sum = 0;
    for(let i=1;i<taps.length;i++) sum += taps[i]-taps[i-1];
    const bpm = Math.round(60000/(sum/(taps.length-1)));
    if(bpm >= 30 && bpm <= 180) setTempo(bpm);
  } else {
    flash("Sigue marcando el pulso…");
  }
}
function setTempo(v){
  state.tempo = +v;
  $("#tempo").value = v;
  $("#tempo-out").textContent = v;
  save();
}

function init(){
  load();
  setTempo(state.tempo);
  $("#btn-metro").setAttribute("aria-pressed", state.metro);
  $("#btn-count").setAttribute("aria-pressed", state.count);
  $("#btn-loop").setAttribute("aria-pressed", state.loop);

  const beats = $("#beats");
  for(let i=0;i<4;i++){
    const d = document.createElement("span");
    d.className = "beat"; d.textContent = i+1;
    beats.appendChild(d);
  }

  document.querySelectorAll(".tab").forEach(t => t.onclick = () => switchTab(t.dataset.tab));
  $("#btn-play").onclick  = togglePlay;
  $("#btn-stop").onclick  = () => { stopPlay(); setNow(null); };
  $("#btn-undo").onclick  = undo;
  $("#btn-clear").onclick = clearAll;
  $("#btn-fill").onclick  = fillWithRests;
  $("#btn-tap").onclick   = tapTempo;
  $("#btn-metro").onclick = e => toggleChip(e.currentTarget, "metro");
  $("#btn-count").onclick = e => toggleChip(e.currentTarget, "count");
  $("#btn-loop").onclick  = e => toggleChip(e.currentTarget, "loop");
  $("#tempo").oninput     = e => setTempo(e.target.value);
  $("#tempo").onchange    = () => { if(play.on) startPlay(true); };

  $("#btn-quiz").onclick   = openQuiz;
  $("#quiz-close").onclick = closeQuiz;
  $("#quiz-again").onclick = hearQuiz;
  $("#quiz-next").onclick  = nextQuiz;
  $("#quiz").onclick = e => { if(e.target.id === "quiz") closeQuiz(); };

  document.addEventListener("keydown", e => {
    if(e.target.matches("input,textarea")) return;
    if(e.code === "Space"){
      e.preventDefault();
      if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
      togglePlay();
    } else if(e.key === "Backspace"){
      e.preventDefault(); undo();
    } else if(e.key === "Escape"){
      if($("#quiz").classList.contains("open")) closeQuiz(); else stopPlay();
    } else if(/^[1-9]$/.test(e.key)){
      const list = CELLS.filter(c => c.tab === state.tab);
      const c = list[+e.key - 1];
      if(c) addCell(c.id);
    }
  });

  switchTab(state.tab);
  renderScore();
  paintPlay();
}

document.addEventListener("DOMContentLoaded", init);
</script>
