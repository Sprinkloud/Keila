    <!-- Pestañas -->
    <nav class="flex border-b border-slate-200 mb-4 text-[11px] font-medium tracking-wide">

      <button onclick="switchTab('extended')" id="tab-extended" class="flex-1 pb-2 border-b text-slate-400 border-transparent hover:text-slate-600 transition-colors">

<script>
  const rhythmicCells = [
    { id: "cell1", name: "chocolate", symbol: "♬♬", duration: 1, subdivisions: 4, pattern: [0.25, 0.25, 0.25, 0.25], type: "base" },
    { id: "cell2", name: "gránchico", symbol: "♪♬", duration: 1, subdivisions: 4, pattern: [0.5, 0.25, 0.25], type: "base" },
    { id: "cell3", name: "camarón", symbol: "♬♪", duration: 1, subdivisions: 4, pattern: [0.25, 0.25, 0.5], type: "base" },
    { id: "cell4", name: "valiente", symbol: "𝅘𝅥𝅯 ♪𝅘𝅥𝅯", duration: 1, subdivisions: 4, pattern: [0.25, 0.5, 0.25], type: "base" },
    { id: "cell5", name: "blanco", symbol: "♩.♪", duration: 1, subdivisions: 4, pattern: [0.75, 0.25], type: "base" },
    { id: "cell9", name: "queso", symbol: "♪♩.", duration: 1, subdivisions: 4, pattern: [0.25, 0.75], type: "base" },
    { id: "cell6", name: "música", symbol: "𝅘𝅥𝅮𝅘𝅥𝅮𝅘𝅥𝅮", duration: 1, subdivisions: 3, pattern: [0.333, 0.333, 0.333], type: "base" },
    { id: "cell7", name: "luna", symbol: "♫", duration: 1, subdivisions: 2, pattern: [0.5, 0.5], type: "base" },
    { id: "cell8", name: "pan", symbol: "♩", duration: 1, subdivisions: 1, pattern: [1], type: "base" },
    { id: "cell11", name: "y", symbol: "♪", duration: 0.5, subdivisions: 1, pattern: [0.5], type: "base" },

    { id: "cell10", name: "Lee", symbol: "♩.", duration: 1.5, subdivisions: 1, pattern: [1.5], type: "extended" },
    { id: "cell12", name: "1, 2", symbol: "𝅗𝅥", duration: 2, subdivisions: 1, pattern: [2], type: "extended" },
    { id: "cell13", name: "1, 2, 3, 4", symbol: "𝅝", duration: 4, subdivisions: 1, pattern: [4], type: "extended" },

    { id: "cell14_1", name: "Semicorchea (t)", symbol: "𝄿", duration: 0.25, subdivisions: 1, pattern: [0.25], type: "silences" },
    { id: "cell14_2", name: "Corchea (y)", symbol: "𝄾", duration: 0.5, subdivisions: 1, pattern: [0.5], type: "silences" },
    { id: "cell8_sil", name: "Negra (pan)", symbol: "𝄽", duration: 1, subdivisions: 1, pattern: [1], type: "silences" },
  ];

  let currentTab = 'base';
  let composition = [];
  let isPlaying = false;
  let currentTempo = 60;
  let audioContext;
  let timeoutIds = [];
  let metronomeActive = false;

  function initAudio() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function toggleMetronome() {
    metronomeActive = !metronomeActive;
    const btn = document.getElementById('metronome-btn');
    const icon = document.getElementById('metronome-icon');
    const text = document.getElementById('metronome-status-text');

    if (metronomeActive) {
      btn.className = "flex items-center gap-1.5 bg-blue-50 border border-blue-200 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-full text-xs font-medium transition-colors";
      icon.className = "fa-solid fa-bell text-[10px] text-blue-600";
      text.textContent = "ON";
      text.className = "font-medium text-blue-600";
    } else {
      btn.className = "flex items-center gap-1.5 bg-slate-50 border border-slate-200 hover:bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full text-xs font-medium transition-colors";
      icon.className = "fa-solid fa-bell-slash text-[10px] text-slate-400";
      text.textContent = "OFF";
      text.className = "font-normal text-slate-500";
    }
  }

  function createCellElement(cell) {
    const button = document.createElement('button');
    button.className = "group w-full bg-slate-50 hover:bg-slate-100/80 border border-slate-200/80 rounded-xl p-2.5 md:p-3.5 flex items-center justify-between transition-all duration-200 text-left shadow-xs";
    button.innerHTML = `
            <div>
                <div class="text-xs font-medium text-slate-700 capitalize group-hover:text-slate-900 transition-colors">${cell.name}</div>
                <div class="text-[9px] md:text-[10px] text-slate-400 font-light mt-0.5">${cell.duration} ${cell.duration === 1 ? 'pulso' : 'pulsos'}</div>
            </div>
            <div class="text-lg md:text-xl text-slate-600 group-hover:text-slate-900 transition-colors font-light music-symbol">${cell.symbol}</div>
        `;
    button.onclick = () => addToComposition(cell);
    return button;
  }

  function renderPalette() {
    const container = document.getElementById('cells-palette');
    container.innerHTML = '';
    const filteredCells = rhythmicCells.filter(cell => cell.type === currentTab);
    filteredCells.forEach(cell => container.appendChild(createCellElement(cell)));
  }

  function switchTab(tabName) {
    currentTab = tabName;
    ['base', 'extended', 'silences'].forEach(t => {
      const el = document.getElementById(`tab-${t}`);
      el.className = t === tabName
              ? "flex-1 pb-2 border-b text-slate-900 border-slate-900 transition-colors"
              : "flex-1 pb-2 border-b text-slate-400 border-transparent hover:text-slate-600 transition-colors";
    });
    renderPalette();
  }

  function renderComposition() {
    const container = document.getElementById('measures-container');
    container.innerHTML = '';

    let accumulatedBeats = 0;
    let currentMeasure = [];
    let measureIndex = 0;

    if (composition.length === 0) {
      container.innerHTML = `
                <div class="border border-dashed border-slate-300 rounded-2xl h-32 md:h-40 flex items-center justify-center text-xs text-slate-400 font-light bg-white/50 p-4 text-center">
                    El lienzo está vacío. Selecciona células en el panel.
                </div>`;
      document.getElementById('total-beats').textContent = '0';
      return;
    }

    composition.forEach((cell, idx) => {
      currentMeasure.push({ cell, originalIndex: idx });
      accumulatedBeats += cell.duration;

      if (accumulatedBeats >= 4 || idx === composition.length - 1) {
        const measureDiv = document.createElement('div');
        measureDiv.className = `staff-measure bg-white border border-slate-200/90 shadow-xs rounded-2xl p-4 md:p-6 relative flex flex-col gap-3 md:gap-4`;
        measureDiv.dataset.measureIndex = measureIndex;

        measureDiv.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <span class="text-[10px] font-mono tracking-wider text-slate-400">COMPÁS 0${measureIndex + 1}</span>
                        <span class="text-[10px] font-light text-slate-500">${accumulatedBeats} / 4 Pulsos</span>
                    </div>
                    <div class="flex flex-wrap gap-2 md:gap-3 items-center min-h-[50px]" id="measure-slots-${measureIndex}"></div>
                `;

        const cellsContainer = measureDiv.querySelector(`#measure-slots-${measureIndex}`);
        currentMeasure.forEach((item) => {
          const cellMini = document.createElement('div');
          cellMini.className = "group relative bg-slate-50 border border-slate-200 hover:border-red-300 hover:bg-red-50/30 rounded-xl px-3 md:px-4 py-2 cursor-pointer flex flex-col items-center justify-center min-w-[56px] md:min-w-[64px] transition-all shadow-xs";
          cellMini.onclick = () => removeCell(item.originalIndex);
          cellMini.innerHTML = `
                        <div class="text-base md:text-lg text-slate-800 group-hover:text-red-600 transition-colors music-symbol">${item.cell.symbol}</div>
                        <div class="text-[8px] md:text-[9px] text-slate-400 uppercase tracking-tight group-hover:hidden">${item.cell.name.split(' ')[0]}</div>
                        <div class="text-[8px] md:text-[9px] text-red-600 uppercase tracking-tight hidden group-hover:block font-medium">Quitar</div>
                    `;
          cellsContainer.appendChild(cellMini);
        });

        container.appendChild(measureDiv);
        currentMeasure = [];
        measureIndex++;
        accumulatedBeats = 0;
      }
    });

    const absoluteTotal = composition.reduce((acc, c) => acc + c.duration, 0);
    document.getElementById('total-beats').textContent = Math.round(absoluteTotal * 100) / 100;
  }

  function addToComposition(cell) {
    const currentTotal = composition.reduce((sum, c) => sum + c.duration, 0);
    const rem = currentTotal % 4;
    const spaceLeftInMeasure = rem === 0 ? 4 : 4 - rem;

    if (cell.duration > spaceLeftInMeasure) {
      triggerStatusAlert(`No cabe en el compás (Disponible: ${spaceLeftInMeasure})`, true);
      return;
    }

    composition.push({...cell});
    renderComposition();
    triggerStatusAlert(`Añadido: ${cell.name}`, false);
  }

  function triggerStatusAlert(message, isError) {
    const status = document.getElementById('status');
    const dot = document.getElementById('status-dot');

    status.textContent = message;
    if (isError) {
      status.className = "text-red-600 font-medium animate-pulse";
      dot.className = "w-1.5 h-1.5 bg-red-600 rounded-full animate-pulse";
    } else {
      status.className = "text-slate-800 font-normal";
      dot.className = "w-1.5 h-1.5 bg-slate-600 rounded-full";
    }

    setTimeout(() => {
      status.textContent = 'Listo';
      status.className = "text-slate-600 font-light";
      dot.className = "w-1.5 h-1.5 bg-slate-400 rounded-full";
    }, 1800);
  }

  function removeCell(index) {
    composition.splice(index, 1);
    renderComposition();
  }

  function addMeasure() {
    const currentTotal = composition.reduce((sum, c) => sum + c.duration, 0);
    const rem = currentTotal % 4;
    const missingBeats = rem === 0 ? 4 : 4 - rem;
    const silenceCell = rhythmicCells.find(c => c.id === "cell8_sil");

    if (missingBeats === 4) {
      for (let i = 0; i < 4; i++) composition.push({...silenceCell});
    } else {
      composition.push({
        id: `dynamic-silence-${Date.now()}`,
        name: "Silencio",
        symbol: "𝄽",
        duration: missingBeats,
        subdivisions: 1,
        pattern: [missingBeats],
        type: "silences"
      });
    }
    renderComposition();
  }

  function clearComposition() {
    composition = [];
    renderComposition();
  }

  async function playRhythm() {
    if (composition.length === 0) return;

    initAudio();
    isPlaying = true;
    updatePlayButton();

    let currentTime = audioContext.currentTime + 0.1;
    const beatDuration = 60 / currentTempo;
    let cumulativeBeats = 0;

    if (metronomeActive) {
      const totalDurationBeats = composition.reduce((sum, c) => sum + c.duration, 0);
      let metronomeTime = currentTime;
      for (let b = 0; b < totalDurationBeats; b++) {
        const isDownbeat = (b % 4 === 0);
        const clickFreq = isDownbeat ? 1000 : 700;
        playTone(clickFreq, metronomeTime, 0.03, 0.3);
        metronomeTime += beatDuration;
      }
    }

    for (let i = 0; i < composition.length; i++) {
      if (!isPlaying) break;

      const cell = composition[i];
      const currentMeasureIndex = Math.floor(cumulativeBeats / 4);

      let timeOffset = 0;

      if(cell.type !== 'silences' && cell.name !== 'Silencio') {
        cell.pattern.forEach((subDuration, j) => {
          const noteTime = currentTime + timeOffset;
          const freq = j === 0 ? 760 : (j % 2 === 0 ? 580 : 440);
          playTone(freq, noteTime, subDuration * beatDuration * 0.85, j === 0 ? 0.5 : 0.25);
          timeOffset += subDuration * beatDuration;
        });
      }

      scheduleHighlight(currentMeasureIndex, (currentTime - audioContext.currentTime) * 1000);

      currentTime += cell.duration * beatDuration;
      cumulativeBeats += cell.duration;

      await new Promise(resolve => {
        const tid = setTimeout(resolve, cell.duration * beatDuration * 1000);
        timeoutIds.push(tid);
      });
    }

    stopPlayback();
  }

  function playTone(freq, time, duration, gainValue = 0.4) {
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.value = freq;

    gainNode.gain.setValueAtTime(gainValue, time);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, time + duration);

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start(time);
    oscillator.stop(time + duration);
  }

  function scheduleHighlight(measureIndex, delayMs) {
    const tid = setTimeout(() => {
      const measures = document.querySelectorAll('.staff-measure');
      measures.forEach(m => {
        if (parseInt(m.dataset.measureIndex) === measureIndex) {
          m.style.borderColor = '#2563eb';
          m.style.backgroundColor = '#eff6ff';
        } else {
          m.style.borderColor = '';
          m.style.backgroundColor = '';
        }
      });
    }, Math.max(0, delayMs));
    timeoutIds.push(tid);
  }

  function togglePlay() {
    if (isPlaying) {
      stopPlayback();
    } else {
      playRhythm();
    }
  }

  function stopPlayback() {
    isPlaying = false;
    updatePlayButton();
    timeoutIds.forEach(id => clearTimeout(id));
    timeoutIds = [];

    document.querySelectorAll('.staff-measure').forEach(m => {
      m.style.borderColor = '';
      m.style.backgroundColor = '';
    });
  }

  function updatePlayButton() {
    const btn = document.getElementById('play-btn');
    const icon = document.getElementById('play-icon');
    const text = document.getElementById('play-text');

    if (isPlaying) {
      btn.className = "h-9 px-5 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium tracking-wide flex items-center gap-2 transition-all shadow-xs";
      icon.className = "fa-solid fa-pause text-[10px]";
      text.textContent = 'PAUSAR';
    } else {
      btn.className = "h-9 px-5 rounded-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium tracking-wide flex items-center gap-2 transition-all shadow-xs";
      icon.className = "fa-solid fa-play text-[10px]";
      text.textContent = 'REPRODUCIR';
    }
  }

  function updateTempo(value) {
    currentTempo = parseInt(value);
    document.getElementById('tempo-value').textContent = currentTempo;
  }

  function init() {
    renderPalette();
    renderComposition();

    document.addEventListener('keydown', (e) => {
      if (e.key === " ") {
        e.preventDefault();
        togglePlay();
      }
    });
  }

  window.onload = init;
</script>

</body>
</html>
