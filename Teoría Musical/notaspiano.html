    body {

    .piano {
      position: relative;
      display: flex;
      width: 100%;
      height: clamp(150px, 30vh, 280px);
      background: var(--foto-papel);
      border-radius: 0 0 10px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .tecla.blanca {
      position: absolute;
      height: 100%;
      background: var(--foto-papel);
      border: 1px solid #DCCFB5;

    { nota: "A", alt: "n", freq: 440.00, tipo: "blanca", octava: 3, vfKey: "a/4", clef: "treble", label: "A4" },
    { nota: "A", alt: "#", freq: 466.16, tipo: "negra", octava: 3, vfKey: "a/4", clef: "treble", label: "A#4" },
    { nota: "B", alt: "n", freq: 493.88, tipo: "blanca", octava: 3, vfKey: "b/4", clef: "treble", label: "B4" },

    // --- OCTAVA 4 (Clave de Sol) ---
    { nota: "C", alt: "n", freq: 523.25, tipo: "blanca", octava: 4, vfKey: "c/5", clef: "treble", label: "C5" },
    { nota: "C", alt: "#", freq: 554.37, tipo: "negra", octava: 4, vfKey: "c/5", clef: "treble", label: "C#5" },
    { nota: "D", alt: "n", freq: 587.33, tipo: "blanca", octava: 4, vfKey: "d/5", clef: "treble", label: "D5" },
    { nota: "D", alt: "#", freq: 622.25, tipo: "negra", octava: 4, vfKey: "d/5", clef: "treble", label: "D#5" },
    { nota: "E", alt: "n", freq: 659.25, tipo: "blanca", octava: 4, vfKey: "e/5", clef: "treble", label: "E5" },
    { nota: "F", alt: "n", freq: 698.46, tipo: "blanca", octava: 4, vfKey: "f/5", clef: "treble", label: "F5" },
    { nota: "F", alt: "#", freq: 739.99, tipo: "negra", octava: 4, vfKey: "f/5", clef: "treble", label: "F#5" },
    { nota: "G", alt: "n", freq: 783.99, tipo: "blanca", octava: 4, vfKey: "g/5", clef: "treble", label: "G5" },
    { nota: "G", alt: "#", freq: 830.61, tipo: "negra", octava: 4, vfKey: "g/5", clef: "treble", label: "G#5" },
    { nota: "A", alt: "n", freq: 880.00, tipo: "blanca", octava: 4, vfKey: "a/5", clef: "treble", label: "A5" },
    { nota: "A", alt: "#", freq: 932.33, tipo: "negra", octava: 4, vfKey: "a/5", clef: "treble", label: "A#5" },
    { nota: "B", alt: "n", freq: 987.77, tipo: "blanca", octava: 4, vfKey: "b/5", clef: "treble", label: "B5" },

    // --- OCTAVA 5 (Clave de Sol) ---
    { nota: "C", alt: "n", freq: 1046.50, tipo: "blanca", octava: 5, vfKey: "c/6", clef: "treble", label: "C6" },
    { nota: "C", alt: "#", freq: 1108.73, tipo: "negra", octava: 5, vfKey: "c/6", clef: "treble", label: "C#6" },
    { nota: "D", alt: "n", freq: 1174.66, tipo: "blanca", octava: 5, vfKey: "d/6", clef: "treble", label: "D6" },
    { nota: "D", alt: "#", freq: 1244.51, tipo: "negra", octava: 5, vfKey: "d/6", clef: "treble", label: "D#6" },
    { nota: "E", alt: "n", freq: 1318.51, tipo: "blanca", octava: 5, vfKey: "e/6", clef: "treble", label: "E6" },
  ];

  const formulasAcordes = {
    'M': [0, 4, 7],
    'm': [0, 3, 7],
    '7': [0, 4, 7, 10],
    'sus2': [0, 2, 7],
    'sus4': [0, 5, 7],
    'dim': [0, 3, 6],
    'aug': [0, 4, 8]
  };

  let ctxAudio = null;
  let juegoActivo = false;
  let notaObjetivo = null;
  let tipoAcordeActivo = 'OFF';

  // Notas de cada modo del juego: [tecla, clave en la que se muestra]
  const sol = keys => keys.map(k => [k, 'treble']);
  const fa = keys => keys.map(k => [k, 'bass']);
  const modosJuego = {
    'sol-lineas':      sol(['e/4', 'g/4', 'b/4', 'd/5', 'f/5']),
    'sol-espacios':    sol(['f/4', 'a/4', 'c/5', 'e/5']),
    'sol-adicionales': sol(['a/3', 'b/3', 'c/4', 'a/5', 'b/5', 'c/6', 'd/6', 'e/6']),
    'fa-lineas':       fa(['g/2', 'b/2', 'd/3', 'f/3', 'a/3']),
    'fa-espacios':     fa(['a/2', 'c/3', 'e/3', 'g/3']),
    'fa-adicionales':  fa(['c/2', 'd/2', 'e/2', 'c/4', 'd/4', 'e/4'])
  };
  modosJuego['ambas'] = Object.values(modosJuego).flat();
  let modoJuego = 'ambas';

  function poolDelModo() {
    return modosJuego[modoJuego].map(([vfKey, clef]) => {
      const tecla = notasPiano.find(n => n.vfKey === vfKey && n.alt === 'n');
      return { vfKey, clef, alt: 'n', label: tecla.label };
    });
  }

  function seleccionarModo(modo) {
    modoJuego = modo;
    document.querySelectorAll('.btn-modo').forEach(btn => btn.classList.toggle('seleccionado', btn.dataset.modo === modo));
    centrarEnModo();
    if (juegoActivo) {
      notaObjetivo = null;
      generarSiguienteNotaJuego();
    }
  }

  const { Renderer, Stave, StaveNote, Accidental, Formatter } = Vex.Flow;

  window.addEventListener('DOMContentLoaded', () => {
    construirTecladoPiano();
    renderizarDoblePentagrama([{ vfKey: 'c/4', alt: 'n', clef: 'treble' }]);
  });

  // Recalcula el ancho de las teclas al cambiar el tamaño de la pantalla
  window.addEventListener('resize', construirTecladoPiano);

  function seleccionarTipoAcorde(tipo, boton) {
    tipoAcordeActivo = tipo;
    document.querySelectorAll('.btn-acorde').forEach(btn => btn.classList.remove('seleccionado'));
    boton.classList.add('seleccionado');
  }

  function renderizarDoblePentagrama(listaNotas) {
    const divPentagrama = document.getElementById('pentagrama');
    divPentagrama.innerHTML = "";

    const renderer = new Renderer(divPentagrama, Renderer.Backends.SVG);
    renderer.resize(340, 255);
    const svgPentagrama = divPentagrama.querySelector('svg');
    svgPentagrama.setAttribute('viewBox', '0 0 340 255');
    svgPentagrama.style.width = '100%';
    svgPentagrama.style.height = 'auto';
    const context = renderer.getContext();

    const staveTreble = new Stave(10, 30, 310);
    staveTreble.addClef("treble");
    staveTreble.setContext(context).draw();

    const staveBass = new Stave(10, 120, 310);
    staveBass.addClef("bass");
    staveBass.setContext(context).draw();

    const brace = new Vex.Flow.StaveConnector(staveTreble, staveBass).setType(3);
    const lineLeft = new Vex.Flow.StaveConnector(staveTreble, staveBass).setType(1);
    const lineRight = new Vex.Flow.StaveConnector(staveTreble, staveBass).setType(6);
    brace.setContext(context).draw();
    lineLeft.setContext(context).draw();
    lineRight.setContext(context).draw();

    const notasTreble = listaNotas.filter(n => n.clef === 'treble');
    const notasBass = listaNotas.filter(n => n.clef === 'bass');

    if (notasTreble.length > 0) {
      const keysTreble = notasTreble.map(n => n.vfKey);
      const notaStaveTreble = new StaveNote({
        keys: keysTreble,
        duration: "q",
        clef: "treble"
      });

      notasTreble.forEach((n, idx) => {
        if (n.alt === '#') {
          notaStaveTreble.addModifier(new Accidental("#"), idx);
        }
      });

      Formatter.FormatAndDraw(context, staveTreble, [notaStaveTreble]);
    }

    if (notasBass.length > 0) {
      const keysBass = notasBass.map(n => n.vfKey);
      const notaStaveBass = new StaveNote({
        keys: keysBass,
        duration: "q",
        clef: "bass"
      });

      notasBass.forEach((n, idx) => {
        if (n.alt === '#') {
          notaStaveBass.addModifier(new Accidental("#"), idx);
        }
      });

      Formatter.FormatAndDraw(context, staveBass, [notaStaveBass]);
    }
  }

  function obtenerContextoAudio() {
    if (!ctxAudio) {
      ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    }
    return ctxAudio;
  }

  function emitirSonidoPiano(frecuencia) {
    const ctx = obtenerContextoAudio();
    if (ctx.state === 'suspended') {
      ctx.resume();
    }

    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(frecuencia, ctx.currentTime);

    gainNode.gain.setValueAtTime(0, ctx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.04);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);

    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 1.5);
  }

  function emitirSonidoError() {
    const ctx = obtenerContextoAudio();
    if (ctx.state === 'suspended') {
      ctx.resume();
    }

    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(130, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.3);

    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  }

  // En pantallas angostas se muestra un tramo del teclado (ventana) y se cambia de octava con las flechas
  const totalBlancas = notasPiano.filter(n => n.tipo === 'blanca').length;
  let inicioVentana = null;

  function blancaDe(vfKey) {
    let k = 0;
    for (const n of notasPiano) {
      if (n.tipo !== 'blanca') continue;
      if (n.vfKey === vfKey) return k;
      k++;
    }
    return 0;
  }

  function blancasVisibles() {
    const ancho = document.getElementById('teclado-piano').clientWidth;
    return Math.max(7, Math.min(totalBlancas, Math.floor(ancho / 34)));
  }

  function limitarVentana(inicio) {
    return Math.max(0, Math.min(totalBlancas - blancasVisibles(), inicio));
  }

  function moverVentana(direccion) {
    inicioVentana = limitarVentana(inicioVentana + direccion * 7);
    construirTecladoPiano();
  }

  // Centra el teclado en las notas del modo elegido
  function centrarEnModo() {
    const ks = poolDelModo().map(n => blancaDe(n.vfKey));
    const centro = (Math.min(...ks) + Math.max(...ks) + 1) / 2;
    inicioVentana = limitarVentana(Math.round(centro - blancasVisibles() / 2));
    construirTecladoPiano();
  }

  // Si la nota del juego quedó fuera del tramo visible, mueve el teclado por octavas hasta mostrarla
  function asegurarVisible(vfKey) {
    const k = blancaDe(vfKey), N = blancasVisibles();
    let inicio = inicioVentana;
    while (k < inicio) inicio -= 7;
    while (k >= inicio + N) inicio += 7;
    inicio = limitarVentana(inicio);
    if (inicio !== inicioVentana) {
      inicioVentana = inicio;
      construirTecladoPiano();
    }
  }

  function construirTecladoPiano() {
    const contenedor = document.getElementById('teclado-piano');
    contenedor.innerHTML = "";

    const N = blancasVisibles();
    if (inicioVentana === null) inicioVentana = blancaDe('c/4') - Math.floor(N / 2) + 1;
    inicioVentana = limitarVentana(inicioVentana);

    const anchoTeclaBlanca = contenedor.clientWidth / N;
    const anchoTeclaNegra = anchoTeclaBlanca * 0.62;
    const fin = inicioVentana + N;

    let contadorBlancas = 0;
    let primera = null, ultima = null;

    notasPiano.forEach((item, index) => {
      let izquierda;
      if (item.tipo === 'blanca') {
        const k = contadorBlancas++;
        if (k < inicioVentana || k >= fin) return;
        izquierda = (k - inicioVentana) * anchoTeclaBlanca;
        if (primera === null) primera = item.label;
        ultima = item.label;
      } else {
        if (contadorBlancas - 1 < inicioVentana || contadorBlancas >= fin) return;
        izquierda = (contadorBlancas - inicioVentana) * anchoTeclaBlanca - anchoTeclaNegra / 2;
      }

      const teclaEl = document.createElement('div');
      teclaEl.className = `tecla ${item.tipo}`;
      teclaEl.innerText = (item.tipo === 'blanca') ? item.label : "";
      teclaEl.dataset.index = index;
      teclaEl.style.width = `${item.tipo === 'blanca' ? anchoTeclaBlanca : anchoTeclaNegra}px`;
      teclaEl.style.left = `${izquierda}px`;

      teclaEl.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        manejarAccionTecla(index);
      });

      contenedor.appendChild(teclaEl);
    });

    const completo = N >= totalBlancas;
    document.getElementById('nav-piano').hidden = completo;
    document.getElementById('rango-piano').textContent = `${primera} – ${ultima}`;
    document.getElementById('octava-grave').disabled = inicioVentana === 0;
    document.getElementById('octava-aguda').disabled = inicioVentana + N >= totalBlancas;
  }

  function generarSiguienteNotaJuego() {
    const pool = poolDelModo();
    let nuevaNota;
    do {
      nuevaNota = pool[Math.floor(Math.random() * pool.length)];
    } while (notaObjetivo && nuevaNota.vfKey === notaObjetivo.vfKey && nuevaNota.clef === notaObjetivo.clef);

    notaObjetivo = nuevaNota;
    asegurarVisible(notaObjetivo.vfKey);
    renderizarDoblePentagrama([{ vfKey: notaObjetivo.vfKey, alt: notaObjetivo.alt, clef: notaObjetivo.clef }]);

    const feedbackEl = document.getElementById('feedback-juego');
    feedbackEl.textContent = "Toca esta nota en el piano";
    feedbackEl.style.color = "var(--dorado)";
  }

  function toggleJuego() {
    juegoActivo = !juegoActivo;
    const btn = document.getElementById('btn-juego');
    const feedbackEl = document.getElementById('feedback-juego');
    const botonesAcorde = document.querySelectorAll('.btn-acorde');

    if (juegoActivo) {
      btn.textContent = "Detener juego";
      btn.classList.add('activo');
      botonesAcorde.forEach(b => b.disabled = true);
      generarSiguienteNotaJuego();
    } else {
      btn.textContent = "Iniciar juego de notas";
      btn.classList.remove('activo');
      botonesAcorde.forEach(b => b.disabled = false);
      notaObjetivo = null;
      feedbackEl.textContent = "Modo libre: Toca cualquier tecla";
      feedbackEl.style.color = "var(--texto-debil)";
      renderizarDoblePentagrama([{ vfKey: 'c/4', alt: 'n', clef: 'treble' }]);
    }
  }

  function obtenerNotasAcorde(indexRaiz, tipo) {
    const intervalos = formulasAcordes[tipo];
    if (!intervalos) return [notasPiano[indexRaiz]];

    const componentes = [];
    intervalos.forEach(semitonos => {
      const indexMapeado = indexRaiz + semitonos;
      if (indexMapeado < notasPiano.length) {
        componentes.push(notasPiano[indexMapeado]);
      }
    });
    return componentes;
  }

  function manejarAccionTecla(indexNota) {
    document.querySelectorAll('.tecla').forEach(el => el.classList.remove('activa'));
    const notaPresionada = notasPiano[indexNota];

    if (!juegoActivo) {
      const esOctavaGrave = notaPresionada.octava === 1 || notaPresionada.octava === 2;

      if (tipoAcordeActivo !== 'OFF' && esOctavaGrave) {
        const listaAcorde = obtenerNotasAcorde(indexNota, tipoAcordeActivo);

        listaAcorde.forEach(n => {
          emitirSonidoPiano(n.freq);
          const elTecla = document.querySelector(`.tecla[data-index="${notasPiano.indexOf(n)}"]`);
          if (elTecla) elTecla.classList.add('activa');
        });

        renderizarDoblePentagrama(listaAcorde);
      } else {
        emitirSonidoPiano(notaPresionada.freq);
        const elTecla = document.querySelector(`.tecla[data-index="${indexNota}"]`);
        if (elTecla) elTecla.classList.add('activa');
        renderizarDoblePentagrama([notaPresionada]);
      }
      return;
    }

    // MODO JUEGO
    const elTecla = document.querySelector(`.tecla[data-index="${indexNota}"]`);
    if (elTecla) elTecla.classList.add('activa');

    const feedbackEl = document.getElementById('feedback-juego');
    // Se compara la altura: una nota con líneas adicionales puede mostrarse en la otra clave
    const coincide = (notaPresionada.alt === 'n' && notaPresionada.vfKey === notaObjetivo.vfKey);

    if (coincide) {
      emitirSonidoPiano(notaPresionada.freq);
      feedbackEl.textContent = "¡Correcto!";
      feedbackEl.style.color = "var(--acierto)";

      setTimeout(() => {
        if (juegoActivo) generarSiguienteNotaJuego();
      }, 700);
    } else {
      emitirSonidoError();
      feedbackEl.textContent = "Inténtalo de nuevo";
      feedbackEl.style.color = "var(--error)";

      setTimeout(() => {
        if (juegoActivo) {
          feedbackEl.textContent = "Toca esta nota en el piano";
          feedbackEl.style.color = "var(--dorado)";
        }
      }, 900);
    }
  }
