/* ---------- Teoría: la misma forma de deletrear notas que practica/hojas.html ---------- */
const SOLFEO = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
const LETRA = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const PC = [0, 2, 4, 5, 7, 9, 11];
const MAYOR = [0, 2, 4, 5, 7, 9, 11], MENOR = [0, 2, 3, 5, 7, 8, 10];
const mod12 = x => ((x % 12) + 12) % 12;
const semis = n => PC[n.l] + n.a + 12 * (n.o || 0);
const alt = a => a === 1 ? '♯' : a === -1 ? '♭' : '';
const nombre = n => SOLFEO[n.l] + alt(n.a);
/** La nota que está "pasos" letras y "st" semitonos más arriba (o abajo, si son negativos), bien deletreada. */
function mover(n, pasos, st) {
  const l = n.l + pasos, o = (n.o || 0) + Math.floor(l / 7), ln = ((l % 7) + 7) % 7;
  const r = { l: ln, a: semis(n) + st - (PC[ln] + 12 * o), o };
  return simplificar(r);
}
/** Sin dobles alteraciones: Fa𝄪 pasa a Sol. */
function simplificar(n) {
  let x = Object.assign({}, n);
  while (x.a > 1) { const s = semis(x); x.l = (x.l + 1) % 7; if (x.l === 0) x.o++; x.a = s - (PC[x.l] + 12 * x.o); }
  while (x.a < -1) { const s = semis(x); x.l = (x.l + 6) % 7; if (x.l === 6) x.o--; x.a = s - (PC[x.l] + 12 * x.o); }
  return x;
}

const nombreTono = t => nombre(t) + (t.m ? ' menor' : ' mayor');

function armadura(t) {
  const out = [0, 0, 0, 0, 0, 0, 0];
  (t.m ? MENOR : MAYOR).forEach((st, i) => { const n = mover({ l: t.l, a: t.a, o: 4 }, i, st); out[n.l] = n.a; });

/** Lee el formato corto de CANCIONES y devuelve una partitura como las de la biblioteca. */
function leerCancion(c) {
  const letra = s => 'CDEFGAB'.indexOf(s[0]), alter = s => s === '#' ? 1 : s === 'b' ? -1 : 0;
  const notas = c.m.split(/\s+/).filter(x => x && x !== '|').map(tok => {
    const m = tok.match(/^(?:\[([A-G])([#b]?)([a-z0-9]*)\])?(?:(r)|([A-G])([#b]?)(\d)):(w|h|q|8|16)(\.?)$/);
    if (!m) throw new Error('No entiendo "' + tok + '" en ' + c.titulo);
    const n = m[4] ? { r: true, d: m[8] } : { l: letra(m[5]), a: alter(m[6]), o: Number(m[7]), d: m[8] };
    if (m[9]) n.pu = true;
    if (m[1]) n.ch = { l: letra(m[1]), a: alter(m[2]), t: m[3] };
    return n;
  });
  const tono = { C: { l: 0, a: 0, m: false }, G: { l: 4, a: 0, m: false }, Am: { l: 5, a: 0, m: true }, Cm: { l: 0, a: 0, m: true } }[c.tono];
  return Object.assign({ titulo: c.titulo, instrumento: 'ambos', compas: c.compas, tono, notas, autor: (AUTORES[c.id] || [''])[0], persona: !!(AUTORES[c.id] || [])[1] }, c.ana ? { ana: c.ana } : {});
}

/* ---------- Transponer: de la tonalidad original a la elegida ---------- */
function intervalo(de, a) {
  let pasos = ((a.l - de.l) % 7 + 7) % 7, st = mod12(semis(a) - semis(de));
  if (st > 6) { pasos -= 7; st -= 12; }
  return [pasos, st];
}
function transpuesta() {
  const [pasos, st] = intervalo(p.tono, ver.tono);
  return p.notas.map(n => {
    const x = n.r ? { r: true, d: n.d } : Object.assign(mover(n, pasos, st), { d: n.d });
    if (n.pu) x.pu = true;
    if (n.ch) { const r = mover({ l: n.ch.l, a: n.ch.a, o: 4 }, pasos, st); x.ch = { l: r.l, a: r.a, t: n.ch.t }; }
    return x;
  });
}
/** Reparte las notas en compases según el compás; una nota que no cabe empieza el compás siguiente. */
function compases(notas, compas, ana) {
  const cap = capacidad(compas), out = [[]];
  let suma = 0, limite = ana > 0 && ana < cap ? ana : cap;   // con anacrusa, el primer compás es más corto
  notas.forEach((n, i) => {
    const d = negras(n);
    if (suma > 0 && suma + d > limite + 1e-9) { out.push([]); suma = 0; limite = cap; }
    out[out.length - 1].push(Object.assign({ i }, n));
    suma += d;
    if (suma >= limite - 1e-9) { out.push([]); suma = 0; limite = cap; }
  });
  if (!out[out.length - 1].length) out.pop();
  return out;
}

/* ---------- Dibujar: partitura con VexFlow o "solo notas" ---------- */
const VF = Vex.Flow;
function dibujarPartitura(notas) {
  const caja = $('#partitura');
  caja.replaceChildren();
  const ancho = Math.max(300, Math.floor(caja.clientWidth || 700));
  const lista = compases(notas, p.compas, p.ana), arm = armadura(ver.tono);
  const cabeza = 52 + 9 * arm.filter(Boolean).length;   // clave + armadura
  const angosto = ancho < 520;   /* en el celular, notas más juntas para que entren 2 o 3 compases por línea */
  const medida = c => (angosto ? 24 : 46) + c.reduce((s, n) => s + (n.ch && ver.acordes ? (angosto ? 30 : 40) : (angosto ? 22 : 30)), 0);
  /* líneas: compases que entran en el ancho */
  const lineas = [];
  let linea = [], usado = 0;
  lista.forEach((c, k) => {
    const w = medida(c) + (linea.length ? 0 : cabeza + (k === 0 ? 26 : 0));
    if (linea.length && usado + w > ancho - 8) { lineas.push(linea); linea = []; usado = 0; }
    linea.push(c); usado += medida(c) + (linea.length === 1 ? cabeza + (k === 0 ? 26 : 0) : 0);
  });
  if (linea.length) lineas.push(linea);
  const altoLinea = ver.acordes ? 130 : 110;
  const r = new VF.Renderer(caja, VF.Renderer.Backends.SVG);
  r.resize(ancho, lineas.length * altoLinea + 10);
  const ctx = r.getContext();
  ctx.setFillStyle('#2B241C'); ctx.setStrokeStyle('#2B241C');
  let primera = true;
  lineas.forEach((ln, li) => {
    const pesos = ln.map((c, k) => medida(c) + (k === 0 ? cabeza + (li === 0 ? 26 : 0) : 0));
    const total = pesos.reduce((a, b) => a + b, 0);
    const factor = li < lineas.length - 1 || total > ancho * 0.6 ? (ancho - 10) / total : 1;
    let x = 4;
    ln.forEach((c, k) => {
      const w = pesos[k] * factor;
      const st = new VF.Stave(x, li * altoLinea + (ver.acordes ? 22 : 4), w);
      if (k === 0) { st.addClef('treble').addKeySignature(vfTono(ver.tono)); if (primera) st.addTimeSignature(p.compas); }
      primera = false;
      st.setContext(ctx).draw();
      const vistas = arm.slice(), propias = {};
      const sn = c.map(n => {
        if (n.r) {
          const x = new VF.StaveNote({ keys: ['b/4'], duration: n.d + 'r' });
          if (n.pu) VF.Dot.buildAndAttach([x], { all: true });
          return x;
        }
        const key = LETRA[n.l].toLowerCase() + '/' + n.o;
        const x = new VF.StaveNote({ keys: [key], duration: n.d, auto_stem: true });
        const llave = n.l + '-' + n.o, actual = llave in propias ? propias[llave] : vistas[n.l];
        if (n.a !== actual) x.addModifier(new VF.Accidental(n.a === 1 ? '#' : n.a === -1 ? 'b' : 'n'), 0);
        propias[llave] = n.a;
        if (n.pu) VF.Dot.buildAndAttach([x], { all: true });
        if (n.ch && ver.acordes) x.addModifier(new VF.Annotation(letraAcorde(n.ch)).setFont('Nunito Sans', 14, 'bold').setVerticalJustification(VF.Annotation.VerticalJustify.TOP), 0);
        return x;
      });
      const voz = new VF.Voice({ num_beats: p.compas === '6/8' ? 6 : capacidad(p.compas), beat_value: p.compas === '6/8' ? 8 : 4 }).setMode(VF.Voice.Mode.SOFT);
      voz.addTickables(sn);
      const vigas = VF.Beam.generateBeams(sn, p.compas === '6/8' ? { groups: [new VF.Fraction(3, 8)] } : {});
      new VF.Formatter().joinVoices([voz]).format([voz], Math.max(20, st.getNoteEndX() - st.getNoteStartX() - 14));
      voz.draw(ctx, st);
      vigas.forEach(b => b.setContext(ctx).draw());
      x += w;
    });
  });
  const svg = caja.querySelector('svg');
  if (svg) { svg.setAttribute('viewBox', '0 0 ' + ancho + ' ' + svg.getAttribute('height')); svg.style.width = ''; svg.style.height = ''; svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Partitura de ' + p.titulo); }
}
function dibujarNotas(notas) {
  const caja = $('#notas');
  caja.replaceChildren();
  compases(notas, p.compas, p.ana).forEach(c => {
    const box = document.createElement('div');
    box.className = 'compas';
    c.forEach(n => {
      const d = document.createElement('div');
      d.className = 'n' + (n.r ? ' silencio' : '');
      d.dataset.i = n.i;
      d.style.minWidth = (negras(n) * 44) + 'px';
      const ac = document.createElement('span'); ac.className = 'ac'; ac.textContent = n.ch && ver.acordes ? letraAcorde(n.ch) : '';
      const nom = document.createElement('span'); nom.className = 'nom'; nom.textContent = n.r ? '—' : nombre(n);
      d.append(ac, nom);
      box.append(d);
    });
    caja.append(box);
  });
}
function dibujar() {
  $('#titulo-hoja').textContent = p.titulo || 'Sin título';
  $('#autor-hoja').textContent = p.autor ? 'Cover · ' + credito() : '';
  $('#datos-hoja').textContent = [NOMBRE_INSTRUMENTO[p.instrumento] || 'Piano', nombreTono(ver.tono), p.compas].join(' · ');
  const notas = transpuesta();
  $('#partitura').hidden = ver.vista !== 'pentagrama';
  $('#notas').hidden = ver.vista !== 'notas';
  if (!notas.length) { $('#partitura').replaceChildren(); $('#notas').replaceChildren(); return; }
  if (ver.vista === 'pentagrama') dibujarPartitura(notas); else dibujarNotas(notas);
}

/* ---------- Escuchar ---------- */
let audio = null, sonando = [];
function tocar() {
  if (sonando.length) { parar(); return; }
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
  const negra = 60 / Number($('#tempo').value);
  let t = audio.currentTime + 0.1;
  const salida = audio.createGain(); salida.gain.value = 0.5; salida.connect(audio.destination);
  const voz = (midi, ini, dur, vol, tipo) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    g.gain.setValueAtTime(0, ini); g.gain.linearRampToValueAtTime(vol, ini + 0.015); g.gain.exponentialRampToValueAtTime(0.001, ini + Math.max(0.12, dur));
    o.connect(g); g.connect(salida); o.start(ini); o.stop(ini + dur + 0.05);
    sonando.push(o);
  };
  const notas = transpuesta(), marcas = [];
  notas.forEach((n, i) => {
    const d = negras(n) * negra;
    if (!n.r) voz(semis(n) + 12, t, d * 0.95, 0.35, 'triangle');
    if (n.ch && ver.acordes) INTERVALOS_ACORDE[n.ch.t].forEach(st => voz(48 + mod12(PC[n.ch.l] + n.ch.a) + st, t, negra * capacidad(p.compas) * 0.9, 0.08, 'sine'));
    marcas.push([i, (t - audio.currentTime) * 1000]);
    t += d;
  });
  const fin = (t - audio.currentTime) * 1000;
  marcas.forEach(([i, ms]) => sonando.push(setTimeout(() => {
    document.querySelectorAll('.n.sonando').forEach(e => e.classList.remove('sonando'));
    const e = document.querySelector('.n[data-i="' + i + '"]'); if (e) e.classList.add('sonando');
  }, ms)));
  sonando.push(setTimeout(parar, fin + 100));
  $('#escuchar').textContent = '■ Parar';
}
function parar() {
  sonando.forEach(x => { if (typeof x === 'number') clearTimeout(x); else try { x.stop(); } catch (e) {} });
  sonando = [];
  document.querySelectorAll('.n.sonando').forEach(e => e.classList.remove('sonando'));
  $('#escuchar').textContent = '▶ Escuchar';
}
/* ---------- Opciones de los selects ---------- */
function opcionesTono(sel, conModo) {
  sel.replaceChildren();
  [[false, TONOS_MAYORES], [true, TONOS_MENORES]].forEach(([m, lista]) => {
    if (!conModo && m !== ver.tono.m) return;
    const g = document.createElement('optgroup'); g.label = m ? 'Menores' : 'Mayores';
    lista.forEach(([l, a]) => { const o = document.createElement('option'); o.value = (m ? 'm' : 'M') + l + ',' + a; o.textContent = nombreTono({ l, a, m }); g.append(o); });
    sel.append(g);
  });
}
const leerTono = v => ({ m: v[0] === 'm', l: Number(v.slice(1).split(',')[0]), a: Number(v.split(',')[1]) });
/* ---------- Cargar y mostrar ---------- */
const SITIO = 'https:/' + '/sprinkloud.vercel.app';
/* "original de Beethoven" para un autor; "canción tradicional francesa" para lo tradicional */
const credito = () => p.persona ? 'original de ' + p.autor : p.autor;
function meta(sel, attr, valor) {
  let e = document.head.querySelector(sel);
  if (!e) { e = document.createElement(sel.startsWith('link') ? 'link' : 'meta'); const m = sel.match(/\[(\w+)="([^"]+)"\]/); e.setAttribute(m[1], m[2]); document.head.append(e); }
  e.setAttribute(attr, valor);
}
/** Título, descripción, canónica y ficha de obra musical para buscadores: una página por canción. */
function seo(id) {
  const url = SITIO + '/practica/partituras' + (id ? '/' + id : '');
  let titulo = id ? p.titulo + ' – cover fácil para piano y violín | Sprinkloud' : 'Partituras fáciles con acordes: piano y violín | Sprinkloud';
  if (titulo.length > 65) titulo = titulo.replace(' | Sprinkloud', '');   /* Google muestra unos 60 caracteres */
  const desc = id ? 'Cover de "' + p.titulo + '"' + (p.autor ? ' (' + credito() + ')' : '') + ' para piano y violín: las notas, la partitura con acordes y cómo suena. Gratis.'
    : 'Covers fáciles de canciones conocidas para piano y violín: notas, partitura con acordes, cambio de tonalidad y audio. Gratis.';
  document.title = titulo;
  meta('meta[name="description"]', 'content', desc);
  meta('link[rel="canonical"]', 'href', url);
  meta('meta[property="og:title"]', 'content', titulo);
  meta('meta[property="og:description"]', 'content', desc);
  meta('meta[property="og:url"]', 'content', url);
  let ld = document.getElementById('ld-cancion');
  if (!id) { if (ld) ld.remove(); return; }
  if (!ld) { ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.id = 'ld-cancion'; document.head.append(ld); }
  const autor = AUTORES[id];
  ld.textContent = JSON.stringify(Object.assign({ '@context': 'https://schema.org', '@type': 'MusicComposition', name: p.titulo, url, inLanguage: 'es',
    isAccessibleForFree: true, musicalKey: nombreTono(p.tono), creditText: 'Cover de Sprinkloud' + (p.autor ? '. ' + credito().charAt(0).toUpperCase() + credito().slice(1) : ''),
    publisher: { '@type': 'Organization', name: 'Club musical Sprinkloud', url: SITIO + '/' } },
    autor && autor[1] ? { composer: { '@type': 'Person', name: autor[0] } } : {}));
}
function mostrar(nueva, id, portada) {
  parar();
  p = copia(nueva); idActual = id || '';
  ver.tono = Object.assign({}, p.tono);
  opcionesTono($('#ver-tono'), false);
  $('#ver-tono').value = (ver.tono.m ? 'm' : 'M') + ver.tono.l + ',' + ver.tono.a;
  $('#compartir').hidden = !idActual;
  /* la portada (/practica/partituras) muestra la primera canción pero conserva su dirección y su SEO */
  if (!portada) history.replaceState(null, '', '/practica/partituras' + (idActual ? '/' + idActual : ''));
  seo(portada ? '' : idActual);
  dibujar();
}
async function pedir(params) {
  const r = await fetch(API + '?' + new URLSearchParams(params));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function cargarBiblioteca() {
  try {
    const r = await pedir({ api: 'partituras' });
    biblioteca = r.partituras || [];
  } catch (e) { biblioteca = []; }   /* sin conexión con la biblioteca, igual se ven las canciones del club */
  pintarBiblioteca();
}
function texto(tag, clase, t) { const e = document.createElement(tag); e.className = clase; e.textContent = t; return e; }
const DEL_CLUB = CANCIONES.map(c => ({ id: c.id, titulo: c.titulo, maestro: 'Cover', autor: (AUTORES[c.id] || [''])[0], instrumento: 'Piano y violín', tonalidad: c.tono, compas: c.compas }));
const NOMBRE_TONALIDAD = s => { const m = (s || '').match(/^([A-G])([#b]?)(m?)$/); return m ? nombreTono({ l: 'CDEFGAB'.indexOf(m[1]), a: m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0, m: !!m[3] }) : s; };
function pintarBiblioteca() {
  const q = $('#buscar').value.trim().toLowerCase(), ins = $('#filtro-ins').value;
  const lista = DEL_CLUB.concat(biblioteca).filter(x => (!ins || x.instrumento.includes(ins)) && (!q || (x.titulo + ' ' + x.maestro + ' ' + (x.autor || '') + ' ' + NOMBRE_TONALIDAD(x.tonalidad)).toLowerCase().includes(q)));
  const caja = $('#biblioteca');
  caja.replaceChildren();
  if (!lista.length) { caja.append(texto('p', 'aviso', biblioteca.length ? 'No hay partituras con esa búsqueda.' : 'Todavía no hay partituras guardadas.')); return; }
  lista.forEach(x => {
    const b = document.createElement('a');
    b.className = 'tarjeta'; b.href = '/practica/partituras/' + x.id;
    b.append(texto('b', '', x.titulo), texto('span', '', [x.autor ? 'Cover · ' + x.autor : x.maestro, NOMBRE_TONALIDAD(x.tonalidad), x.compas].filter(Boolean).join(' · ')));
    b.addEventListener('click', e => { if (e.ctrlKey || e.metaKey || e.shiftKey) return; e.preventDefault(); abrir(x.id); });
    caja.append(b);
  });
}
async function abrir(id) {
  const delClub = CANCIONES.find(c => c.id === id);
  if (delClub) { mostrar(leerCancion(delClub), id); window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  estado('Abriendo…');
  try {
    const r = await pedir({ api: 'partitura', id });
    if (r.error) throw new Error(r.error);
    const { titulo, instrumento, compas, tono, notas, ana } = r.partitura;
    mostrar(Object.assign({ titulo, instrumento, compas, tono, notas }, ana ? { ana } : {}), r.partitura.id);
    estado('');
    window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  } catch (e) { estado(e.message === 'No existe esa partitura.' ? e.message : 'No se pudo abrir la partitura.', true); }
}
function estado(t, error) { const e = $('#estado'); e.textContent = t; e.className = 'estado' + (error ? ' error' : ''); }
/* ---------- Eventos ---------- */
function iniciar() {
  $('#ver-tono').addEventListener('change', e => { ver.tono = leerTono(e.target.value); parar(); dibujar(); });
  const botonesGrupo = (a, b, fn) => { $(a).addEventListener('click', () => fn(true)); $(b).addEventListener('click', () => fn(false)); };
  botonesGrupo('#vista-notas', '#vista-pentagrama', notas => { ver.vista = notas ? 'notas' : 'pentagrama'; $('#vista-notas').setAttribute('aria-pressed', notas); $('#vista-pentagrama').setAttribute('aria-pressed', !notas); dibujar(); });
  $('#escuchar').addEventListener('click', tocar);   /* en la vista de notas se ilumina la que suena */
  $('#imprimir').addEventListener('click', () => window.print());
  $('#compartir').addEventListener('click', () => {
    const url = location.origin + '/practica/partituras/' + idActual;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { $('#compartir').textContent = '¡Copiado!'; setTimeout(() => { $('#compartir').textContent = 'Copiar enlace'; }, 1500); }, () => prompt('Copia el enlace:', url));
  });
  $('#buscar').addEventListener('input', pintarBiblioteca);
  $('#filtro-ins').addEventListener('change', pintarBiblioteca);
  let espera;
  addEventListener('resize', () => { clearTimeout(espera); espera = setTimeout(dibujar, 200); });

  /* qué canción se abre: la del enlace o la primera del club */
  const id = (location.pathname.match(/\/partituras\/([A-Za-z0-9-]{3,40})$/) || [])[1] || new URLSearchParams(location.search).get('id');
  if (id) abrir(id); else mostrar(leerCancion(CANCIONES[0]), CANCIONES[0].id, true);
  cargarBiblioteca();
}
iniciar();
</script>
