<script>
/* ---------- La guía (semana, etapa, tema, objetivo); la fuente es Registro_Sprinkloud/Guia.js ---------- */
const GUIA = /*GUIA*/[[1,"1 · Cuerpo y pulso","El pulso","Mantiene el pulso 30 segundos con el metrónomo a 80, con palmas y en el pecho."],[2,"1 · Cuerpo y pulso","Largo y corto: ta y ti-ti","Dice y palmea ritmos de 4 pulsos con ta (negra) y ti-ti (corcheas)."],[3,"1 · Cuerpo y pulso","El silencio","Reconoce y respeta el silencio de negra dentro de un ritmo de 4 pulsos."],[4,"1 · Cuerpo y pulso","Agudo y grave","Distingue si un sonido sube o baja y lo muestra con el cuerpo."],[5,"1 · Cuerpo y pulso","Sol-mi: primeras notas cantadas","Canta sol-mi afinado y lo encuentra en su instrumento."],[6,"1 · Cuerpo y pulso","Ostinato y conjunto","Mantiene un ritmo repetido (ostinato) mientras otro suena distinto."],[7,"2 · Primeras lecturas","El pentagrama","Nombra líneas y espacios del pentagrama y ubica una nota en cada uno."],[8,"2 · Primeras lecturas","Clave de sol: sol, mi, la","Lee y canta sol, mi y la en clave de sol."],[9,"2 · Primeras lecturas","Do-re-mi","Canta, toca y ubica do, re y mi en el pentagrama."],[10,"2 · Primeras lecturas","La escala de Do","Canta la escala de Do subiendo y bajando, diciendo el nombre de cada nota."],[11,"2 · Primeras lecturas","Figuras: redonda, blanca, negra, corchea","Dice cuánto dura cada figura y la toca con su duración."],[12,"2 · Primeras lecturas","Compás: 2/4, 3/4 y 4/4","Marca el acento del compás y reconoce si una canción va en 2, 3 o 4."],[13,"2 · Primeras lecturas","Primera lectura de 4 compases","Lee y toca una melodía de 4 compases en clave de sol sin parar."],[14,"2 · Primeras lecturas","Dictado rítmico","Escucha un ritmo de 4 pulsos y lo escribe correctamente."],[15,"3 · Lectura y ritmo","El puntillo","Lee y toca blanca con puntillo y negra con puntillo."],[16,"3 · Lectura y ritmo","Semicorcheas: ta-ka-di-mi","Dice y toca 4 semicorcheas parejas en un pulso."],[17,"3 · Lectura y ritmo","Combinaciones: ta-di-mi y ta-ka-di","Lee corchea + 2 semicorcheas y 2 semicorcheas + corchea."],[18,"3 · Lectura y ritmo","Ligadura y síncopa","Toca una síncopa simple sin acelerar."],[19,"3 · Lectura y ritmo","Coordinación: pulso y ritmo a la vez","Marca el pulso con una mano y dice el ritmo con la voz al mismo tiempo."],[20,"3 · Lectura y ritmo","Clave de fa: líneas / Cuerda Sol","Piano: nombra y toca las 5 líneas de la clave de fa (sol, si, re, fa, la). Violín: lee y toca las notas de la cuerda Sol."],[21,"3 · Lectura y ritmo","Clave de fa: espacios / Cuerda Mi","Piano: nombra y toca los 4 espacios de la clave de fa (la, do, mi, sol). Violín: lee y toca las notas de la cuerda Mi."],[22,"3 · Lectura y ritmo","Líneas adicionales: clave de sol / abajo","Piano: lee las notas con líneas adicionales en clave de sol. Violín: lee las notas con líneas adicionales abajo del pentagrama."],[23,"3 · Lectura y ritmo","Líneas adicionales: clave de fa / arriba","Piano: lee las notas con líneas adicionales en clave de fa. Violín: lee las notas con líneas adicionales arriba del pentagrama."],[24,"3 · Lectura y ritmo","Lectura con todas las notas","Lee una melodía de 8 compases usando todo lo aprendido."],[25,"3 · Lectura y ritmo","Las 12 notas: sostenidos y bemoles","Nombra las 12 notas en orden (con sus sostenidos y bemoles) y las toca."],[26,"3 · Lectura y ritmo","Tono y semitono","Distingue tono y semitono en su instrumento y de oído."],[27,"3 · Lectura y ritmo","Intervalos 1: segundas y terceras","Explica qué es un intervalo y reconoce 2ª y 3ª, menores y mayores, contando semitonos."],[28,"4 · Intervalos, escalas y acordes","Intervalos 2: cuarta, quinta, tritono y octava","Reconoce de oído 4ª justa, 5ª justa, tritono y 8ª, con canciones de referencia."],[29,"4 · Intervalos, escalas y acordes","Intervalos 3: sextas y séptimas","Nombra los 12 intervalos con sus semitonos y reconoce de oído al menos 6."],[30,"4 · Intervalos, escalas y acordes","La escala mayor: fórmula e intervalos","Construye una escala mayor con T-T-S-T-T-T-S, nombra sus intervalos y la canta."],[31,"4 · Intervalos, escalas y acordes","Escalas de Sol y Fa mayor y su armadura","Toca Sol y Fa mayor y explica qué dice la armadura."],[32,"4 · Intervalos, escalas y acordes","Orden de los sostenidos: ¿en qué tonalidad estoy?","Dice el orden de los sostenidos y descubre la tonalidad mayor de una armadura (el último sostenido más un semitono)."],[33,"4 · Intervalos, escalas y acordes","Orden de los bemoles","Dice el orden de los bemoles y descubre la tonalidad mayor de una armadura con bemoles (el penúltimo bemol; con uno solo, Fa mayor)."],[34,"4 · Intervalos, escalas y acordes","Triadas mayor y menor","Arma un acorde mayor (4 + 3) y uno menor (3 + 4) desde cualquier nota y los distingue de oído."],[35,"4 · Intervalos, escalas y acordes","Triadas aumentada y disminuida","Construye las 4 triadas y analiza los acordes de la canción que toca."],[36,"4 · Intervalos, escalas y acordes","Inversiones de acordes","Reconoce un acorde invertido, dice su nombre y qué nota tiene en el bajo (Do/Mi, Do/Sol)."],[37,"4 · Intervalos, escalas y acordes","Armonizar la escala mayor","Nombra los 7 acordes que salen de Do mayor (I a VII) y dice cuáles son mayores y menores."],[38,"5 · Tonalidad: reposo, mayor y menor","Centro tonal y reposo","Reconoce de oído cuándo una canción \"llega a casa\" (reposo en el I)."],[39,"5 · Tonalidad: reposo, mayor y menor","Progresiones mayores: I, IV, V y vi","Acompaña una canción sencilla con I, IV, V y vi."],[40,"5 · Tonalidad: reposo, mayor y menor","Escala menor natural y su relativa","Explica que La menor y Do mayor tienen las mismas notas y distingue de oído mayor y menor."],[41,"5 · Tonalidad: reposo, mayor y menor","Progresiones menores","Toca una progresión que reposa en un acorde menor (i, iv, v o VI, VII)."],[42,"5 · Tonalidad: reposo, mayor y menor","Círculo de quintas: mayores, menores y sus acordes","Usa el círculo para ubicar una tonalidad, su relativa menor, sus 6 acordes y sus vecinas (para progresiones y cambios de tonalidad)."],[43,"5 · Tonalidad: reposo, mayor y menor","Escala pentatónica","Construye la pentatónica mayor y menor quitando 2 notas de su escala."],[44,"5 · Tonalidad: reposo, mayor y menor","Improvisar con la pentatónica","Improvisa 8 compases con la pentatónica sobre una base, terminando en reposo."],[45,"5 · Tonalidad: reposo, mayor y menor","Compás de 6/8","Siente y toca el 6/8 en dos grandes pulsos."],[46,"5 · Tonalidad: reposo, mayor y menor","Dictado melódico","Escribe una melodía corta de 4 compases de oído."],[47,"6 · Músico completo","Dinámicas y articulaciones","Toca piano, forte, crescendo, ligado y staccato cuando lo pide la partitura."],[48,"6 · Músico completo","Tempo y términos","Conoce Lento, Andante, Allegro y los toca con el metrónomo."],[49,"6 · Músico completo","La forma: AB y ABA","Reconoce las partes de una canción y las nombra."],[50,"6 · Músico completo","Lectura a primera vista","Lee 8 compases nuevos sin parar, aunque se equivoque."],[51,"6 · Músico completo","Acorde de séptima de dominante","Construye el V7 y explica por qué \"pide\" volver al I."],[52,"6 · Músico completo","Proyecto: mi primera composición","Compone y toca 8 compases usando compás, escala, acordes y reposo."],[53,"7 · Los modos griegos","¿Qué es un modo?","Explica qué es un modo (las mismas notas con otra nota casa) y nombra los 7 modos con su tecla blanca."],[54,"7 · Los modos griegos","El modo eólico: la menor natural","Toca el modo eólico y explica en qué se diferencia del jónico."],[55,"7 · Los modos griegos","El modo mixolidio","Toca el modo mixolidio y dice su nota característica (la séptima menor)."],[56,"7 · Los modos griegos","El modo dórico","Toca el modo dórico y dice su nota característica (la sexta mayor)."],[57,"7 · Los modos griegos","El modo lidio","Toca el modo lidio y dice su nota característica (la cuarta aumentada)."],[58,"7 · Los modos griegos","El modo frigio","Toca el modo frigio y dice su nota característica (la segunda menor)."],[59,"7 · Los modos griegos","El modo locrio","Toca el modo locrio y explica por qué suena inestable (la quinta disminuida)."],[60,"7 · Los modos griegos","Los 7 modos, del más brillante al más oscuro","Ordena los 7 modos por su brillo y los reconoce de oído (mayor o menor y su nota característica)."]];
/* Las lecciones 20 a 23 son distintas en piano y en violín: el tema dice «piano / violín» y el objetivo
   «Piano: … Violín: …». parteDe deja solo la del instrumento. */
function parteDe(texto, ins) {
  const t = String(texto || ''), m = t.match(/^Piano: (.*?) Violín: (.*)$/);
  if (m) return ins === 'violin' ? m[2] : m[1];
  const p = t.split(' / ');
  return p.length === 2 ? p[ins === 'violin' ? 1 : 0] : t;
}

/* ---------- Teoría: notas, escalas, intervalos y acordes ---------- */
const SOLFEO = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
const LETRA = ['c', 'd', 'e', 'f', 'g', 'a', 'b'];
const PC = [0, 2, 4, 5, 7, 9, 11];
const MAYOR = [0, 2, 4, 5, 7, 9, 11], MENOR = [0, 2, 3, 5, 7, 8, 10];
const nota = (l, a = 0, o = 4) => ({ l: ((l % 7) + 7) % 7, a, o });
const semis = n => PC[n.l] + n.a + 12 * n.o;
const nombre = n => SOLFEO[n.l] + (n.a === 1 ? '♯' : n.a === -1 ? '♭' : n.a === 2 ? '𝄪' : n.a === -2 ? '𝄫' : '');
const vfKey = n => LETRA[n.l] + (n.a === 1 ? '#' : n.a === -1 ? 'b' : '') + '/' + n.o;
/** La nota que está a "pasos" letras y "st" semitonos arriba de n, con la alteración que corresponda. */
function arriba(n, pasos, st) {
  const l = n.l + pasos, o = n.o + Math.floor(l / 7);
  const sinAlt = nota(l % 7, 0, o);
  return nota(l % 7, semis(n) + st - semis(sinAlt), o);
}
const escala = (t, patron) => patron.map((st, i) => arriba(t, i, st));
const TRIADAS = { mayor: [4, 7], menor: [3, 7], aumentada: [4, 8], disminuida: [3, 6] };
const triada = (r, tipo) => [r, arriba(r, 2, TRIADAS[tipo][0]), arriba(r, 4, TRIADAS[tipo][1])];
const tipoDe = (n3, n5, r) => Object.keys(TRIADAS).find(k => semis(n3) - semis(r) === TRIADAS[k][0] && semis(n5) - semis(r) === TRIADAS[k][1]);
const simple = ns => ns.every(n => Math.abs(n.a) <= 1);
const mod12 = x => ((x % 12) + 12) % 12;
/** Tipo de la triada que se forma sobre el grado k de una escala (con las notas de la misma escala). */

function ritmoEn(contenedor, figuras, compas, ancho = 300) {

      const d = el('div'); notasEn(d, ns, { ancho: 150, alto: 130, acorde: true });
      return item(i, d, el('div', { class: 'respuestas' }, eleccion(tipos.map(t => t[0].toUpperCase() + t.slice(1)), tipo[0].toUpperCase() + tipo.slice(1))));
    }), { papel: 'Hoja pautada' });
  },
  armonizar({ tonicas, menor = false }) {
    return ejercicio('Armoniza la escala', 'Escribe el acorde de cada grado (ejemplo: Rem, Sol, Si°).', tonicas.map((t, i) => {
      const ns = escala(t, menor ? MENOR : MAYOR);
      return item(i, el('div', { class: 'enunciado', text: nombre(t) + (menor ? ' menor' : ' mayor') }),
        el('div', { class: 'respuestas' }, ns.map((r, k) =>
          el('span', {}, el('span', { class: 'sep', text: ROMANOS[k] + ' ' }), campoAcorde(r, tipoGrado(ns, k))))));
    }), { anchos: true, papel: 'Hoja rayada' });
  },
  grados({ tonicas, preguntas, menor = false, cant = 6 }) {
    const lista = distintos(cant, () => ({ t: uno(tonicas), k: uno(preguntas) }), x => nombre(x.t) + x.k);
    return ejercicio('¿Qué acorde es el grado…?', 'Escribe el acorde del grado que se pide (ejemplo: Rem).', lista.map(({ t, k }, i) => {
      const ns = escala(t, menor ? MENOR : MAYOR);
      return item(i, el('div', { class: 'enunciado', text: 'Grado ' + ROMANOS[k] + ' de ' + nombre(t) + (menor ? ' menor' : ' mayor') }), el('div', { class: 'respuestas' }, campoAcorde(ns[k], tipoGrado(ns, k))));
    }), { papel: 'Hoja rayada' });
  },
  /* la armadura escrita con sus alteraciones; el alumno escribe la tonalidad mayor (29-oct) */
  queTonalidad({ tonalidades }) {
    const SOST = [nota(3, 1), nota(0, 1), nota(4, 1), nota(1, 1), nota(5, 1), nota(2, 1), nota(6, 1)];
    const BEM = [nota(6, -1), nota(2, -1), nota(5, -1), nota(1, -1), nota(4, -1), nota(0, -1), nota(3, -1)];
    return ejercicio('¿En qué tonalidad estoy?', 'Sostenidos: el último más un semitono. Bemoles: el penúltimo (con uno solo, Fa mayor).', tonalidades.map((x, i) =>
      item(i, el('div', { class: 'enunciado', text: (x.n > 0 ? SOST.slice(0, x.n) : BEM.slice(0, -x.n)).map(nombre).join(', ') + ' →' }),
        el('div', { class: 'respuestas' }, campoNota(x.t), el('span', { class: 'sep', text: 'mayor' })))), { papel: 'Hoja rayada' });
  },
  /* los modos (etapa 7, 29-oct): con las teclas blancas, cada tecla de inicio es un modo */
  queModo({ cuales }) {
    // en la primera lección se aprenden los 7 nombres con su tecla blanca; después, solo los modos ya vistos
    const preguntas = cuales.length === 1 ? MODOS_HOJA : MODOS_HOJA.filter((_, i) => cuales.includes(i));
    return ejercicio('¿Qué modo es?', 'Con las teclas blancas, la nota donde empieza dice el modo.', mezclar(preguntas).map((m, i) =>
      item(i, el('div', { class: 'enunciado', text: 'De ' + NOMBRES_BLANCAS[m.b] + ' a ' + NOMBRES_BLANCAS[m.b] }), el('div', { class: 'respuestas' }, eleccion(MODOS_HOJA.map(x => x.n), m.n, 'Modo')))), { papel: 'Hoja rayada' });
  },
  escalaModo({ cuales }) {
    return T.secuencia({ titulo: 'Completa el modo', consigna: 'Solo teclas blancas, desde la nota casa hasta la misma nota arriba.', series: MODOS_HOJA.filter((_, i) => cuales.includes(i)).map(m =>
      Array.from({ length: 8 }, (_, k) => nota((m.b + k) % 7, 0, 4 + Math.floor((m.b + k) / 7)))), cant: cuales.length });
  },
  notaCaracteristica({ cuales }) {
    return ejercicio('La nota característica', 'La nota que hace único al modo (la que lo diferencia de la escala mayor o de la menor).', MODOS_HOJA.filter((m, i) => cuales.includes(i) && m.car !== null).map((m, i) =>
      item(i, el('div', { class: 'enunciado', text: NOMBRES_BLANCAS[m.b] + ' ' + m.n.toLowerCase() + ' →' }), el('div', { class: 'respuestas' }, campoNota(nota((m.b + m.car) % 7, 0, 4))))), { papel: 'Hoja rayada' });
  },
  relativas({ tonicas }) {
    return ejercicio('La relativa menor', 'La relativa menor empieza en el 6.º grado de la escala mayor (o 3 semitonos abajo).', tonicas.map((t, i) =>
      item(i, el('div', { class: 'enunciado', text: nombre(t) + ' mayor →' }), el('div', { class: 'respuestas' }, campoNota(escala(t, MAYOR)[5]), el('span', { class: 'sep', text: 'menor' })))), { papel: 'Hoja rayada' });
  },
  pentatonica({ tonicas }) {
    return ejercicio('Escala pentatónica', 'Mayor: quita los grados 4 y 7. Menor: quita los grados 2 y 6.', tonicas.map(([t, menor], i) => {
      const ns = escala(t, menor ? MENOR : MAYOR).filter((_, k) => menor ? k !== 1 && k !== 5 : k !== 3 && k !== 6);
      return item(i, el('div', { class: 'enunciado', text: 'Pentatónica de ' + nombre(t) + (menor ? ' menor' : ' mayor') }), el('div', { class: 'respuestas' }, ns.map(campoNota)));
    }), { anchos: true, papel: 'Hoja rayada' });
  },
  septima({ tonicas }) {
    return ejercicio('Acorde de séptima de dominante', 'Escribe las 4 notas del V7 (mayor + séptima menor) y el acorde al que resuelve.', tonicas.map((t, i) => {
      const v = escala(t, MAYOR)[4], ns = triada(v, 'mayor').concat([arriba(v, 6, 10)]);
      return item(i, el('div', { class: 'enunciado', text: 'V7 de ' + nombre(t) + ' mayor' }), el('div', { class: 'respuestas' }, ns.map(campoNota), el('span', { class: 'sep', text: '→' }), campoAcorde(t, 'mayor')));
    }), { anchos: true, papel: 'Hoja rayada' });
  },
  inversiones({ cant = 6 }) {
    const lista = distintos(cant, () => ({ r: nota(uno([0, 3, 4, 1, 5, 2])), tipo: uno(['mayor', 'menor']), inv: uno([1, 2]) }), x => nombre(x.r) + x.tipo + x.inv);
    return ejercicio('Inversiones', 'Escribe las notas desde el bajo.', lista.map(({ r, tipo, inv }, i) => {
      const ns = triada(r, tipo);
      const orden = inv === 1 ? [ns[1], ns[2], ns[0]] : [ns[2], ns[0], ns[1]];
      return item(i, el('div', { class: 'enunciado', text: nombre(r) + ' ' + tipo + ', ' + inv + 'ª inversión' }), el('div', { class: 'respuestas' }, orden.map(campoNota)));
    }), { papel: 'Hoja rayada' });
  },
  terminos({ lista, titulo }) {
    const opciones = lista.map(x => x[1]);
    return ejercicio(titulo, 'Elige el significado.', mezclar(lista).map(([t, s], i) =>
      item(i, el('div', { class: 'enunciado', text: t }), el('div', { class: 'respuestas' }, eleccion(opciones, s)))), { medianos: true, papel: 'Hoja rayada' });
  }
};

/* Lo que ve el alumno es "Etapa 1 · Lección 2", nunca el número de semana (estresa a quien lleva años de clases);
   la semana queda como clave interna de la guía. */
function etapaLeccion(s) {
  const g = GUIA.find(x => x[0] === s);
  return [parseInt(g[1], 10), GUIA.filter(x => x[1] === g[1] && x[0] <= s).length];
}
function semanaDe(e, l) { const g = GUIA.filter(x => parseInt(x[1], 10) === e)[l - 1]; return g ? g[0] : 0; }
const nivel = s => { const [e, l] = etapaLeccion(s); return 'Etapa ' + e + ' · Lección ' + l; };
/* Enlace de cada lección: /practica/hojas/violin/etapa-1-leccion-2. Los viejos /semana-2 y ?semana=2&i=violin también sirven. */
const ruta = location.pathname.match(/\/hojas\/(piano|violin)\/(?:semana-(\d+)|etapa-(\d+)-leccion-(\d+))/);
const semanaRuta = ruta ? (ruta[2] ? Number(ruta[2]) : semanaDe(Number(ruta[3]), Number(ruta[4]))) : 0;
let variante = Number(params.get('v')) || 1;
function armar() {
  const s = Number($('#semana').value), ins = $('#instrumento').value, g = GUIA.find(x => x[0] === s);
  semilla = s * 9973 + variante * 131;
  campos = []; idCampo = 0;
  const hoja = $('#hoja');
  const conHoja = tieneHoja(s);
  ['#otra', '#imprimir', '.acciones'].forEach(x => { $(x).hidden = !conHoja; });
  $('#resultado').hidden = true;
  const [e, l] = etapaLeccion(s);
  history.replaceState(null, '', '/practica/hojas/' + ins + '/etapa-' + e + '-leccion-' + l + (variante > 1 ? '?v=' + variante : ''));
  if (!conHoja) {
    hoja.replaceChildren(el('div', { class: 'sin-hoja' },
      el('span', { class: 'etapa', text: nivel(s) }),
      el('h2', { text: parteDe(g[2], ins) }),
      el('p', { text: 'Esta lección no tiene hoja de práctica: lo que se aprende se practica tocando, en clase y con la app de la lección.' })));
    return;
  }
  hoja.replaceChildren(el('div', { class: 'hoja-cabeza' },
    el('span', { class: 'etapa', text: nivel(s) }),
    el('h2', { text: parteDe(g[2], ins) }),
    el('p', { text: parteDe(g[3], ins) }),
    el('div', { class: 'datos-alumno' }, el('span', { text: 'Nombre:' }), el('span', { text: 'Fecha:' }))));
  ejerciciosDe(s, ins).forEach(e => hoja.append(e));
}
function revisar() {
  let bien = 0, total = 0;
  campos.forEach(c => {
    const v = c.dibujo ? null : c.el.value;
    if (!c.dibujo && v === '') { c.el.classList.remove('ok', 'mal'); total++; return; }
    total++;
    const ok = c.ok(v);
    if (ok) bien++;
    c.el.classList.toggle('ok', ok); c.el.classList.toggle('mal', !ok);
  });
  const r = $('#resultado');
  r.hidden = false;
  r.className = 'resultado' + (bien / Math.max(total, 1) < 0.8 ? ' medio' : '');
  r.textContent = bien + ' de ' + total + ' correctas' + (bien === total ? ' 🎉 ¡Hoja perfecta!' : '. Revisa las marcadas y vuelve a intentar.');
}
function verSoluciones() {
  document.querySelectorAll('.solucion').forEach(x => x.remove());
  campos.forEach(c => c.el.closest('.respuestas, .item').append(el('div', { class: 'solucion', text: c.solucion })));
}
function iniciar() {
  const sel = $('#semana');
  let etapa = '';
  GUIA.forEach(([s, et, tema]) => {
    if (et !== etapa) { etapa = et; sel.append(el('optgroup', { label: 'Etapa ' + et })); }
    sel.lastChild.append(el('option', { value: s, text: 'Lección ' + etapaLeccion(s)[1] + '. ' + tema + (tieneHoja(s) ? '' : ' (sin hoja)') }));
  });
  sel.value = String(Math.min(Math.max(semanaRuta || Number(params.get('semana')) || 1, 1), GUIA.length));
  $('#instrumento').value = (ruta ? ruta[1] : params.get('i')) === 'violin' ? 'violin' : 'piano';
  sel.addEventListener('change', () => { variante = 1; armar(); });
  $('#instrumento').addEventListener('change', armar);
  $('#otra').addEventListener('click', () => { variante++; armar(); });
  $('#imprimir').addEventListener('click', () => window.print());
  $('#revisar').addEventListener('click', revisar);
  $('#soluciones').addEventListener('click', verSoluciones);
  armar();
}
iniciar();
</script>
<script>window.SprinkloudPractica = { app: 'Hojas de práctica', detalle: function () { var s = Number(document.querySelector('#semana').value), g = GUIA.find(function (x) { return x[0] === s; }), r = document.querySelector('#resultado'); return nivel(s) + ': ' + parteDe(g[2], document.querySelector('#instrumento').value) + (r && !r.hidden ? ' · ' + r.textContent : ''); } };</script>
